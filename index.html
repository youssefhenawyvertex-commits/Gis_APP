/* ──────────────────────────────────────────────────────────────────────────
   CAD IMAGE EXPORT MODAL — black & white plan view with north arrow,
   user-placed text labels (click anywhere to add), and polygon hatching.
   ────────────────────────────────────────────────────────────────────────── */
/* ── CAD hatch patterns: each layer gets its own pattern so overlapping
   layers stay visually distinct even when small or stacked.               ── */
const HATCH_PATTERNS = [
  // angle, spacing-ratio, strokeRatio  (spacing & stroke are fractions of dimMax)
  { angle: 45,  spacingR: 0.012, strokeR: 0.0010 },  // layer 0 – diagonal /
  { angle: 135, spacingR: 0.012, strokeR: 0.0010 },  // layer 1 – diagonal \
  { angle: 0,   spacingR: 0.012, strokeR: 0.0010 },  // layer 2 – horizontal
  { angle: 90,  spacingR: 0.012, strokeR: 0.0010 },  // layer 3 – vertical
  { angle: 45,  spacingR: 0.018, strokeR: 0.0010 },  // layer 4 – wide diagonal
  { angle: 0,   spacingR: 0.018, strokeR: 0.0010 },  // layer 5 – wide horiz
  { angle: 90,  spacingR: 0.018, strokeR: 0.0010 },  // layer 6 – wide vert
];

/* ── Compute per-polygon hatch size based on the polygon's own bounding box,
   clamped so it is never larger than dimMax * 0.05 or smaller than dimMax * 0.004 ── */
function polyHatchSpacing(ring, dimMax) {
  if (!ring || ring.length === 0) return dimMax * 0.012;
  let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  ring.forEach(([x, y]) => {
    if (x < xmin) xmin = x; if (x > xmax) xmax = x;
    if (y < ymin) ymin = y; if (y > ymax) ymax = y;
  });
  const polyDim = Math.max(xmax - xmin, ymax - ymin) || dimMax;
  // Aim for ~8 hatch lines across the polygon; clamp to a sane global range
  const raw = polyDim / 8;
  return Math.min(Math.max(raw, dimMax * 0.004), dimMax * 0.05);
}

const CADExportModal = ({ open, onClose, layers }) => {
  const svgRef = useRef(null);
  const [mode, setMode] = useState("label");
  const [strokeScale, setStrokeScale] = useState(1.0);   // global stroke multiplier
  const [hatchedIds, setHatchedIds] = useState(() => new Set());

  /* labelItems: Map<polyId, { text, x, y, fontSize, rotation }>
     x,y are in SVG user-space coords (same as the polygon coords).
     They start at the polygon centroid and the user can drag them freely.   */
  const [labelItems, setLabelItems] = useState(() => new Map());

  /* which label is being dragged right now */
  const dragRef   = useRef(null);   // { id, startSvgX, startSvgY, startLabelX, startLabelY }
  const wrapperRef = useRef(null);  // outer div for zoom/pan

  /* which label is selected (shows resize handle) */
  const [selectedLabel, setSelectedLabel] = useState(null);

  /* ── Zoom / pan state ── */
  const [zoom, setZoom] = useState(1);
  const [pan, setPan]   = useState({ x: null, y: null }); // null = use vbX/vbY once computed
  const isPanning = useRef(false);
  const panStart  = useRef({ mx: 0, my: 0, px: 0, py: 0 });

  /* ── Free-label counter — must be here (before early return) ── */
  const [nextLabelId, setNextLabelId] = useState(0);
  /* ── Label size in screen pixels — user-controlled. Applies to ALL labels.
         Per-label override is still possible via the ◢ drag handle.        ── */
  const [labelPx, setLabelPx] = useState(28);
  /* ── Current label tool: null = select/idle, "write" = next canvas click adds a label ── */
  const [labelTool, setLabelTool] = useState(null);
  /* ── Inline text editor that floats over the canvas at the click point.
         Replaces window.prompt() so the user can SEE the label as they type,
         right where it will be placed.                                    ── */
  const [inlineInput, setInlineInput] = useState(null);
  // { svgX, svgY, screenX, screenY, value }
  const inputRef = useRef(null);

  useEffect(() => {
    if (open) {
      setHatchedIds(new Set()); setLabelItems(new Map());
      setSelectedLabel(null); setInlineInput(null); setLabelTool(null);
      setZoom(1); setPan({ x: null, y: null });
    }
  }, [open]);

  const dataset = useMemo(() => {
    if (!open) return { polys: [], zone: null, hemi: "N", layerCount: 0 };
    let zone = null, hemi = "N";
    layers.forEach(l => { if (l.visible && l.kind === "shapefile" && l.zone && !zone) { zone = l.zone; hemi = l.hemi; } });
    const polys = [];
    let visLayerIdx = 0;
    layers.forEach((layer, li) => {
      if (!layer.visible || layer.kind !== "shapefile") return;
      const layerPatternIdx = visLayerIdx % HATCH_PATTERNS.length;
      const layerOrder = visLayerIdx;
      visLayerIdx++;
      (layer.geojson || []).forEach((fc, fci) => {
        (fc.features || []).forEach((feat, fi) => {
          const g = feat.geometry;
          if (!g) return;
          let polyArr;
          if (g.type === "Polygon") polyArr = [g.coordinates];
          else if (g.type === "MultiPolygon") polyArr = g.coordinates;
          else return;
          polyArr.forEach((rings, pi) => polys.push({
            id: `${li}-${fci}-${fi}-${pi}`,
            rings,
            layerPatternIdx,
            layerOrder,
          }));
        });
      });
    });
    return { polys, zone, hemi, layerCount: visLayerIdx };
  }, [open, layers]);

  const sceneCtxRef = useRef({ vbW: 1, vbH: 1 });

  /* ── Slider يغير حجم كل الترميزات الموجودة فوراً ── */
  useEffect(() => {
    if (!open) return;
    setLabelItems(prev => {
      if (prev.size === 0) return prev;
      const next = new Map();
      prev.forEach((item, id) => next.set(id, { ...item, fontPx: labelPx }));
      return next;
    });
  }, [labelPx, open]);

  if (!open) return null;

  let mLat = 0, mN = 0;
  if (!dataset.zone) {
    dataset.polys.forEach(p => p.rings[0].forEach(([, lat]) => { mLat += lat; mN++; }));
    mLat = mN ? mLat / mN : 0;
  }
  const project = (c) => {
    if (dataset.zone) { const [e, n] = toUtm(c, dataset.zone, dataset.hemi); return [e, -n]; }
    const k = Math.cos(mLat * Math.PI / 180);
    return [c[0] * k * 111319.5, -c[1] * 111319.5];
  };
  const projected = dataset.polys.map(p => ({
    id: p.id,
    rings: p.rings.map(ring => ring.map(project)),
    layerPatternIdx: p.layerPatternIdx,
  }));

  let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  projected.forEach(p => p.rings[0].forEach(([x, y]) => {
    if (x < xmin) xmin = x; if (x > xmax) xmax = x;
    if (y < ymin) ymin = y; if (y > ymax) ymax = y;
  }));
  const w = (xmax - xmin) || 1, h = (ymax - ymin) || 1;
  const dimMax = Math.max(w, h);
  const padSide = dimMax * 0.05, padTop = dimMax * 0.14, padBottom = dimMax * 0.05;
  const vbX = xmin - padSide, vbY = ymin - padTop, vbW = w + 2 * padSide, vbH = h + padTop + padBottom;

  /* ── Stroke width: مبنية على vbW الفعلي مش dimMax
     ده بيضمن إن كل البوليجونات إطارها ظاهر بغض النظر عن حجمها
     نريد الخط يكون 0.15% من عرض الـ viewBox تقريباً                      ── */
  const strokeWidth = vbW * 0.0015;

  /* ── Label font size: relative to viewBox but clamped per-polygon later  ── */
  const baseLabelFontSize = dimMax * 0.022;  // default; user resizes per-label by dragging

  /* ── Convert the user's labelPx slider value → SVG scene units.
     We treat labelPx as a percentage of dimMax/10 so the label always
     looks right relative to the drawing regardless of real-world scale.
     labelPx=28 → fontSize ≈ 2.8% of dimMax  (readable on any plot size)
     The user can fine-tune with the slider or the ◢ per-label handle.   ── */
  const pxToScene = (px) => (px / 1000) * dimMax;

  // Expose current viewBox dims to the labelPx → fontSize sync effect
  // (which runs BEFORE this code path due to the early-return above).\n  sceneCtxRef.current.vbW = vbW;
  sceneCtxRef.current.vbH = vbH;





  const naSize = dimMax * 0.055, naX = vbX + naSize * 1.4, naY = vbY + naSize * 1.7;

  const polyMeta = projected.map((p) => {
    const ring = p.rings[0];
    let A = 0, cx = 0, cy = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      const [x1, y1] = ring[i], [x2, y2] = ring[i + 1];
      const f = x1 * y2 - x2 * y1;
      A += f; cx += (x1 + x2) * f; cy += (y1 + y2) * f;
    }
    A /= 2;
    const centroid = A !== 0
      ? [cx / (6 * A), cy / (6 * A)]
      : [ring.reduce((s, c) => s + c[0], 0) / ring.length,
         ring.reduce((s, c) => s + c[1], 0) / ring.length];

    /* Per-polygon bounding box */
    let pxmin = Infinity, pxmax = -Infinity, pymin = Infinity, pymax = -Infinity;
    ring.forEach(([x, y]) => {
      if (x < pxmin) pxmin = x; if (x > pxmax) pxmax = x;
      if (y < pymin) pymin = y; if (y > pymax) pymax = y;
    });
    const polyW = pxmax - pxmin || dimMax * 0.01;
    const polyH = pymax - pymin || dimMax * 0.01;
    const polyDim = Math.max(polyW, polyH);

    // Hatch spacing: ~8 lines across polygon, clamped
    const hatchSpacing = Math.min(Math.max(polyDim / 8, dimMax * 0.004), dimMax * 0.05);

    // Font size: always at least dimMax*0.010 so tiny buildings (200–300 m²) still
    // get a readable label in the exported PNG.  There is intentionally NO upper cap
    // tied to the polygon's own dimensions — the label can be larger than the polygon
    // (it will just sit centred on it) which is exactly what you want for small plots.
    const labelFontSize = Math.max(baseLabelFontSize, dimMax * 0.010);

    /* Per-polygon stroke width = نفس الـ strokeWidth العام
       ده بيضمن إن كل البوليجونات إطارها ظاهر بنفس السُمك */
    const polyStrokeWidth = strokeWidth;

    return { ...p, centroid, hatchSpacing, labelFontSize, polyStrokeWidth, polyDim };
  });

  /* Sort polyMeta by descending area (polyDim proxy) so large polygons render first
     and small buildings are always painted on top — regardless of layer order. */
  const polyMetaSorted = [...polyMeta].sort((a, b) => b.polyDim - a.polyDim);
  // ── SVG preview normalization ──
// مهم جدًا: بننقل إحداثيات UTM الكبيرة لإحداثيات محلية صغيرة
// عشان المتصفح ما يعملش تقطيع في stroke عند الزوم.
const cleanPreviewRing = (ring) => {
  const eps = Math.max(dimMax * 1e-9, 0.001); // تقريبًا 1 مم أو حسب حجم الرسمة
  const out = [];

  for (const [x, y] of ring) {
    const px = x - vbX;
    const py = y - vbY;

    const last = out[out.length - 1];
    if (!last || Math.hypot(px - last[0], py - last[1]) > eps) {
      out.push([px, py]);
    }
  }

  // لو آخر نقطة = أول نقطة، شيلها وخلي Z يقفل المسار
  if (out.length > 2) {
    const first = out[0];
    const last = out[out.length - 1];
    if (Math.hypot(first[0] - last[0], first[1] - last[1]) <= eps) {
      out.pop();
    }
  }

  return out;
};

const ringToPath = (ring) => {
  if (!ring || ring.length === 0) return "";
  return ring
    .map(([x, y], i) => `${i === 0 ? "M" : "L"} ${x.toFixed(3)} ${y.toFixed(3)}`)
    .join(" ") + " Z";
};

const polyMetaPreview = polyMetaSorted.map(p => ({
  ...p,
  rings: p.rings.map(cleanPreviewRing),
  centroid: [p.centroid[0] - vbX, p.centroid[1] - vbY],
}));

const previewVbX = pan.x == null ? 0 : pan.x - vbX;
const previewVbY = pan.y == null ? 0 : pan.y - vbY;

const naXPreview = naX - vbX;
const naYPreview = naY - vbY;

  /* ── Hatch ── */
  const toggleHatch = (id) => setHatchedIds(s => {
    const next = new Set(s); next.has(id) ? next.delete(id) : next.add(id); return next;
  });

  /* ── Label: stored in FULL SCENE coords (same space as polygon rings).
     sceneX/Y are stable — zoom/pan/export all use the same toX/toY.        ── */
  const addLabelAtPoint = (sceneX, sceneY, text) => {
    const v = (text ?? "").toString().trim();
    if (!v) return;
    const id = "free_" + Date.now() + "_" + nextLabelId;
    setNextLabelId(n => n + 1);
    setLabelItems(prev => {
      const next = new Map(prev);
      next.set(id, { text: v, sceneX, sceneY, fontPx: labelPx });
      return next;
    });
    setSelectedLabel(id);
  };

  /* ── Confirm / cancel inline editor ── */
  const commitInline = () => {
    if (!inlineInput) return;
    const v = inlineInput.value.trim();
    setInlineInput(null);
    if (v) addLabelAtPoint(inlineInput.sceneX, inlineInput.sceneY, v);
  };
  const cancelInline = () => setInlineInput(null);

  const handlePolyClick = (poly) => {
    // In label mode, clicks on polygons are ignored — handled by SVG canvas click
    if (mode === "hatch") toggleHatch(poly.id);
  };

  const handleSvgClick = (e) => {
    if (mode !== "label") { setSelectedLabel(null); return; }
    if (labelTool !== "write") { setSelectedLabel(null); return; }
    if (e.target !== e.currentTarget && e.target.tagName !== "svg") {
      const tag = e.target.tagName;
      if (tag === "text" || tag === "rect" || tag === "g") return;
    }
    const svg = svgRef.current;
    if (!svg) return;
    // ── حوّل نقطة الضغط لوحدات الـ SVG viewBox (preview space) عبر CTM ──
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return;
    const svgPt = pt.matrixTransform(ctm.inverse());
    // svgPt.x/y = preview space (scene - vbX/vbY) → نضيف vbX/vbY للـ full scene
    const sceneX = svgPt.x + vbX;
    const sceneY = svgPt.y + vbY;

    const wrap = wrapperRef.current;
    if (!wrap) return;
    const wrect = wrap.getBoundingClientRect();
    setInlineInput({
      sceneX, sceneY,
      screenXWrap: e.clientX - wrect.left,
      screenYWrap: e.clientY - wrect.top,
      value: "",
    });
    setLabelTool(null);
    requestAnimationFrame(() => { try { inputRef.current?.focus(); } catch {} });
  };

  /* ── SVG-space mouse coords helper ── */
  const svgPoint = (e) => {
    const svg = svgRef.current;
    if (!svg) return { x: 0, y: 0 };
    const pt = svg.createSVGPoint();    pt.x = e.clientX; pt.y = e.clientY;
    const m = svg.getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const inv = m.inverse();
    const tp = pt.matrixTransform(inv);
    return { x: tp.x, y: tp.y };
  };

  /* ── Label drag — delta computed in SVG scene space via CTM ── */
  const onLabelMouseDown = (e, id) => {
    e.stopPropagation();
    const item = labelItems.get(id);
    if (!item) return;
    setSelectedLabel(id);
    const startMX = e.clientX, startMY = e.clientY;
    const startScX = item.sceneX, startScY = item.sceneY;
    const svg = svgRef.current;
    const onMove = (ev) => {
      let dScX = 0, dScY = 0;
      if (svg) {
        const ctm = svg.getScreenCTM();
        if (ctm) {
          const inv = ctm.inverse();
          const p0 = svg.createSVGPoint(); p0.x = startMX; p0.y = startMY;
          const p1 = svg.createSVGPoint(); p1.x = ev.clientX; p1.y = ev.clientY;
          const s0 = p0.matrixTransform(inv);
          const s1 = p1.matrixTransform(inv);
          dScX = s1.x - s0.x;
          dScY = s1.y - s0.y;
        }
      }
      setLabelItems(prev => {
        const next = new Map(prev);
        const cur = next.get(id);
        if (!cur) return prev;
        next.set(id, { ...cur, sceneX: startScX + dScX, sceneY: startScY + dScY });
        return next;
      });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  /* ── Label font-size resize — changes fontPx directly ── */
  const onResizeMouseDown = (e, id) => {
    e.stopPropagation();
    const item = labelItems.get(id);
    if (!item) return;
    const startY = e.clientY, startPx = item.fontPx;
    const onMove = (ev) => {
      const dy = ev.clientY - startY;
      const newPx = Math.max(8, startPx + dy);
      setLabelItems(prev => {
        const next = new Map(prev);
        const cur = next.get(id);
        if (!cur) return prev;
        next.set(id, { ...cur, fontPx: newPx });
        return next;
      });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  /* ── PNG export: بنبني SVG جديد من الـ data مباشرة لضمان الـ viewport الصحيح ── */
  const exportPNG = () => {
    if (polyMetaSorted.length === 0) return;
    setSelectedLabel(null);

    // ── نرسم على Canvas 2D مباشرة — بدون SVG ──
    const W = 1000;
    const H = Math.round(W * vbH / vbW);
    const canvas = document.createElement('canvas');
    canvas.width  = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    // دالة تحويل الـ coordinates من وحدات الـ scene للـ pixels
    const toX = function(x) { return (x - vbX) / vbW * W; };
    const toY = function(y) { return (y - vbY) / vbH * H; };

    // خلفية بيضاء
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // stroke width بالـ pixels (2px ثابت * strokeScale)
    const strokePx = Math.max(2 * strokeScale, 1.5);

    // دالة رسم ring على الـ ctx
    const drawRing = function(ring) {
      ctx.beginPath();
      for(var i=0;i<ring.length;i++){
        var px = toX(ring[i][0]);
        var py = toY(ring[i][1]);
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
    };

    // ── ارسم كل polygon ──
    polyMetaSorted.forEach(function(p) {
      var hasHatch = hatchedIds.has(p.id);
      var pat = HATCH_PATTERNS[p.layerPatternIdx] || HATCH_PATTERNS[0];

      // 1) Fill أبيض دايماً الأول
      ctx.beginPath();
      drawRing(p.rings[0]);
      p.rings.slice(1).forEach(function(h){ drawRing(h); });
      ctx.fillStyle = '#ffffff';
      ctx.fill('evenodd');

      // 2) تهشير لو محدد
      if (hasHatch) {
        var sp = toX(vbX + p.hatchSpacing) - toX(vbX);
        sp = Math.max(sp, 4);

        var pxmin=Infinity,pxmax=-Infinity,pymin=Infinity,pymax=-Infinity;
        p.rings[0].forEach(function(pt){
          var x=toX(pt[0]),y=toY(pt[1]);
          if(x<pxmin)pxmin=x; if(x>pxmax)pxmax=x;
          if(y<pymin)pymin=y; if(y>pymax)pymax=y;
        });
        var cx2=(pxmin+pxmax)/2, cy2=(pymin+pymax)/2;
        var diagLen=Math.sqrt((pxmax-pxmin)*(pxmax-pxmin)+(pymax-pymin)*(pymax-pymin))+sp*2;
        var angle=pat.angle*Math.PI/180;

        ctx.save();
        ctx.beginPath();
        drawRing(p.rings[0]);
        p.rings.slice(1).forEach(function(h){ drawRing(h); });
        ctx.clip('evenodd');
        ctx.strokeStyle='#000000';
        ctx.lineWidth=Math.max(1,strokePx*0.5);
        // نرسم الخطوط بدون translate — نحسب إحداثيات كل خط يدوياً
        var cos=Math.cos(angle), sin=Math.sin(angle);
        for(var t=-diagLen;t<=diagLen;t+=sp){
          var x1=cx2+t*cos-diagLen*(-sin), y1=cy2+t*sin-diagLen*cos;
          var x2=cx2+t*cos+diagLen*(-sin), y2=cy2+t*sin+diagLen*cos;
          ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        }
        ctx.restore();
      }

      // 3) Stroke الحدود
      ctx.beginPath();
      drawRing(p.rings[0]);
      ctx.strokeStyle='#000000';
      ctx.lineWidth=strokePx;
      ctx.lineJoin='round';
      ctx.stroke();

      // 4) Holes
      p.rings.slice(1).forEach(function(h){
        ctx.beginPath(); drawRing(h);
        ctx.fillStyle='#ffffff'; ctx.fill();
        ctx.strokeStyle='#000000'; ctx.lineWidth=strokePx; ctx.stroke();
      });
    });

    // ── ارسم الترميزات (labels) — sceneX/Y → canvas pixels via toX/toY ──
    if (labelItems.size > 0) {
      var svgEl2 = svgRef.current;
      var svgW2 = svgEl2 ? svgEl2.getBoundingClientRect().width : 800;
      labelItems.forEach(function(item) {
        var cx3 = toX(item.sceneX);
        var cy3 = toY(item.sceneY);
        var fs = Math.max(8, Math.round(item.fontPx / svgW2 * W));
        ctx.font = 'bold ' + fs + 'px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth   = fs * 0.25;
        ctx.lineJoin    = 'round';
        ctx.strokeText(item.text, cx3, cy3);
        ctx.fillStyle = '#000000';
        ctx.fillText(item.text, cx3, cy3);
      });
    }

    // ── ارسم سهم الشمال ──
    var nx = toX(naX), ny = toY(naY);
    var ns = Math.min(W,H) * 0.045;
    ctx.font = 'bold ' + Math.round(ns*0.55) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#000000';
    ctx.fillText('N', nx, ny - ns*1.18);

    ctx.beginPath();
    ctx.moveTo(nx, ny - ns);
    ctx.lineTo(nx - ns*0.42, ny + ns*0.42);
    ctx.lineTo(nx, ny + ns*0.18);
    ctx.lineTo(nx + ns*0.42, ny + ns*0.42);
    ctx.closePath();
    ctx.fillStyle = '#000000';
    ctx.fill();

    // ── حفظ كـ JPG ──
    canvas.toBlob(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cad_image.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    }, 'image/jpeg', 0.95);
  };

  return (
    <div className="fixed inset-0 z-[2000] bg-slate-900/55 backdrop-blur-sm grid place-items-center p-4" onClick={onClose}>
      <div className="bg-[var(--panel)] rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden" onClick={e => e.stopPropagation()} dir="rtl">
        <header className="px-5 py-4 border-b border-slate-200 flex items-center gap-3">
          <div className="w-9 h-9 rounded-lg bg-slate-900 text-white grid place-items-center"><Icon name="cad" size={18} /></div>
          <div className="flex-1 min-w-0">
            <div className="text-[15px] font-bold text-slate-900">تصدير صورة الأوتوكاد</div>
            <div className="text-[11.5px] text-slate-500 mt-0.5">رسم أبيض وأسود مع سهم شمال — تهشير وترميز تكيّفي</div>
          </div>
          <button onClick={onClose} className="w-9 h-9 grid place-items-center rounded-md text-slate-500 hover:bg-slate-100"><Icon name="close" size={20} /></button>
        </header>
        <div className="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[280px_1fr]">
          <aside className="border-l border-slate-200 bg-slate-50/60 p-4 space-y-3 overflow-y-auto scroll-thin">
            <div className="rounded-xl border border-[var(--line)] bg-[var(--panel)] p-1 flex gap-1">
              <button onClick={() => setMode("label")} className={`flex-1 px-3 py-2 rounded-lg text-[12.5px] font-semibold transition ${mode === "label" ? "bg-[var(--ink)] text-[var(--bg)]" : "text-[var(--ink-soft)] hover:bg-[var(--panel-2)]"}`}>ترميز</button>
              <button onClick={() => setMode("hatch")} className={`flex-1 px-3 py-2 rounded-lg text-[12.5px] font-semibold transition ${mode === "hatch" ? "bg-[var(--ink)] text-[var(--bg)]" : "text-[var(--ink-soft)] hover:bg-[var(--panel-2)]"}`}>تهشير</button>
            </div>
            {mode === "label" ? (
              <div className="rounded-xl border border-[var(--line)] bg-[var(--panel)] p-3.5 space-y-3">
                {/* Tool toggle: write mode */}
                <button
                  onClick={() => setLabelTool(t => t === "write" ? null : "write")}
                  className={`w-full flex items-center gap-2.5 rounded-lg px-3 py-2.5 transition border ${
                    labelTool === "write"
                      ? "bg-[var(--ink)] border-[var(--ink)] text-[var(--bg)]"
                      : "bg-[var(--panel)] border-[var(--line)] text-[var(--ink)] hover:bg-[var(--panel-2)]"
                  }`}
                >
                  <span className={`grid place-items-center w-8 h-8 rounded-lg shrink-0 ${
                    labelTool === "write" ? "bg-white/15" : "bg-[var(--panel-2)]"
                  }`}>
                    {/* pencil icon */}
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M12 20h9" />
                      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
                    </svg>
                  </span>
                  <div className="text-right flex-1 min-w-0">
                    <div className="text-[13px] font-semibold leading-tight">
                      {labelTool === "write" ? "اضغط على الرسم لإضافة الترميز…" : "كتابة ترميز"}
                    </div>
                    <div className={`text-[10.5px] mt-0.5 leading-tight ${labelTool === "write" ? "text-white/70" : "text-[var(--ink-soft)]"}`}>
                      {labelTool === "write" ? "اضغط مرة أخرى للإلغاء" : "فعّل ثم اضغط مكان الترميز"}
                    </div>
                  </div>
                </button>

                <div className="text-[11px] text-[var(--ink-soft)] leading-relaxed">
                  بعد إضافة الترميز: اضغط عليه ليظهر مقبضا التحريك <span className="inline-block w-4 h-4 align-middle bg-blue-600 text-white rounded text-[9px] leading-4 text-center">✥</span> والحجم <span className="inline-block w-4 h-4 align-middle bg-blue-600 text-white rounded text-[9px] leading-4 text-center">◢</span>.<br/>
                  Enter للتأكيد · Esc للإلغاء.
                </div>
                <div>
                  <div className="flex items-center justify-between text-[11px] text-slate-600 mb-1.5">
                    <span>حجم الخط (يطبَّق على الكل)</span>
                    <span className="font-mono text-slate-400 text-[10.5px]">px</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => setLabelPx(p => Math.max(4, p - 1))}
                      className="w-8 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-base grid place-items-center shrink-0"
                      aria-label="تصغير"
                    >−</button>
                    <div className="relative flex-1">
                      <input
                        type="number"
                        min={1}
                        max={100}
                        step={1}
                        value={labelPx}
                        onChange={e => {
                          const v = parseInt(e.target.value, 10);
                          if (!Number.isNaN(v)) setLabelPx(Math.max(4, Math.min(400, v)));
                        }}
                        className="w-full h-9 rounded-lg border border-slate-200 bg-white text-center font-mono text-[14px] font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition tabular-nums"
                      />
                      <span className="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] font-mono text-slate-400 pointer-events-none">px</span>
                    </div>
                    <button
                      onClick={() => setLabelPx(p => Math.min(400, p + 1))}
                      className="w-8 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-base grid place-items-center shrink-0"
                      aria-label="تكبير"
                    >+</button>
                  </div>
                  <div className="text-[10px] text-slate-400 mt-1 leading-tight">
                    اكتب رقم الحجم بالـ px ليُطبّق على جميع الترميزات. لتعديل ترميز بعينه استخدم المقبض ◢.
                  </div>
                </div>
                <div>
                  <div className="flex items-center justify-between text-[11px] text-slate-600 mb-1.5">
                    <span>سُمك الخطوط</span><span className="font-mono text-slate-900">{strokeScale.toFixed(1)}×</span>
                  </div>
                  <input type="range" min={0.2} max={4} step={0.1} value={strokeScale}
                    onChange={e => setStrokeScale(parseFloat(e.target.value))} className="w-full accent-slate-900" />
                </div>
                <div className="flex items-center justify-between pt-1 border-t border-slate-100 text-[10.5px]">
                  <span className="text-slate-500">الترميزات: <span className="font-mono text-slate-700">{labelItems.size}</span></span>
                  {labelItems.size > 0 && <button onClick={() => { setLabelItems(new Map()); setSelectedLabel(null); }} className="text-slate-600 hover:text-red-600 font-medium">إلغاء الكل</button>}
                </div>
              </div>
            ) : (
              <div className="rounded-xl border border-slate-200 bg-white p-3.5 space-y-3">
                <div className="text-[12px] text-slate-600 leading-relaxed">اضغط على أي مضلع لتهشيره. كل طبقة تحصل على نمط تهشير مختلف تلقائياً.</div>
                <div className="flex items-center justify-between pt-1 border-t border-slate-100 text-[10.5px]">
                  <span className="text-slate-500">المهشّر: <span className="font-mono text-slate-700">{hatchedIds.size}/{(polyMetaSorted||[]).length}</span></span>
                  {hatchedIds.size > 0 && <button onClick={() => setHatchedIds(new Set())} className="text-slate-600 hover:text-red-600 font-medium">إلغاء الكل</button>}
                </div>
              </div>
            )}
            <div className="text-[10.5px] text-slate-500 leading-relaxed px-1 pt-1">
              المضلعات: <span className="font-mono text-slate-700">{(polyMetaSorted||[]).length}</span>
              <span className="mx-2 text-slate-300">•</span>
              المرجع: <span className="font-mono text-slate-700">{dataset.zone ? `UTM ${dataset.zone}${dataset.hemi}` : "تقريبي"}</span>
            </div>
          </aside>
          <main
            ref={el => {
              wrapperRef.current = el;
              // أول مرة بيظهر الـ container، نعمل fit تلقائي
              if (el && vbW && vbH && zoom === 1) {
                const { width: cW, height: cH } = el.getBoundingClientRect();
                if (cW && cH) {
                  const fz = Math.min(cW / vbW, cH / vbH) * 0.92;
                  if (fz > 0 && fz < 10) setTimeout(() => { setZoom(fz); setPan({ x: null, y: null }); }, 0);
                }
              }
            }}
            className="bg-slate-100 p-4 min-h-0 overflow-hidden relative select-none flex items-center justify-center"
            style={{ cursor: isPanning.current ? "grabbing" : (mode === "label" && labelTool === "write" ? "crosshair" : "default") }}
            onWheel={e => {
              e.preventDefault();
              const svg = svgRef.current;
              if (!svg) return;
              const rect = svg.getBoundingClientRect();
              // Current viewBox (accounts for current zoom+pan)
              const curPanX = pan.x ?? vbX;
              const curPanY = pan.y ?? vbY;
              const curVbW  = vbW / zoom;
              const curVbH  = vbH / zoom;
              // Mouse position in SVG user-space (using CURRENT viewBox scale)
              const mouseUX = curPanX + (e.clientX - rect.left) * (curVbW / rect.width);
              const mouseUY = curPanY + (e.clientY - rect.top)  * (curVbH / rect.height);
              const factor  = e.deltaY < 0 ? 1.15 : 1 / 1.15;
              const nz = Math.min(Math.max(zoom * factor, 0.5), 60);
              // New pan: keep mouseU fixed → newPan = mouseU - mouseU_offset_in_new_viewBox
              const newVbW = vbW / nz;
              const newVbH = vbH / nz;
              const fx = (e.clientX - rect.left) / rect.width;   // 0..1 within SVG element
              const fy = (e.clientY - rect.top)  / rect.height;
              setZoom(nz);
              setPan({ x: mouseUX - fx * newVbW, y: mouseUY - fy * newVbH });
            }}
            onMouseDown={e => {
              if (e.button === 1 || e.button === 2) {
                e.preventDefault();
                isPanning.current = true;
                const svg = svgRef.current;
                const rect = svg ? svg.getBoundingClientRect() : { width: 1, height: 1 };
                // Scale using CURRENT viewBox size (affected by zoom)
                const scaleX = (vbW / zoom) / rect.width;
                const scaleY = (vbH / zoom) / rect.height;
                panStart.current = {
                  mx: e.clientX, my: e.clientY,
                  px: pan.x ?? vbX, py: pan.y ?? vbY,
                  scaleX, scaleY,
                };
              }
            }}
            onMouseMove={e => {
              if (!isPanning.current) return;
              const dx = (e.clientX - panStart.current.mx) * panStart.current.scaleX;
              const dy = (e.clientY - panStart.current.my) * panStart.current.scaleY;
              setPan({ x: panStart.current.px - dx, y: panStart.current.py - dy });
            }}
            onMouseUp={() => { isPanning.current = false; }}
            onMouseLeave={() => { isPanning.current = false; }}
            onContextMenu={e => e.preventDefault()}
          >
            {/* Zoom controls */}
            <div className="absolute bottom-3 left-3 z-10 flex flex-col gap-1">
              <button onClick={() => { const cx = (pan.x??vbX)+(vbW/zoom)/2; const cy = (pan.y??vbY)+(vbH/zoom)/2; const nz=Math.min(zoom*1.25,60); setPan({x:cx-vbW/nz/2,y:cy-vbH/nz/2}); setZoom(nz); }}
                className="w-8 h-8 bg-white border border-slate-200 rounded-lg shadow text-lg font-bold text-slate-700 hover:bg-slate-50 flex items-center justify-center">+</button>
              <button onClick={() => {
                  const wrap = wrapperRef.current;
                  if (wrap && vbW && vbH) {
                    const { width: cW, height: cH } = wrap.getBoundingClientRect();
                    if (cW && cH) { setZoom(Math.min(cW / vbW, cH / vbH) * 0.92); setPan({ x: null, y: null }); return; }
                  }
                  setZoom(1); setPan({ x: null, y: null });
                }}
                className="w-8 h-8 bg-white border border-slate-200 rounded-lg shadow text-[10px] font-bold text-slate-700 hover:bg-slate-50 flex items-center justify-center">⌂</button>
              <button onClick={() => setZoom(z => Math.max(z/1.25,0.5))}
                className="w-8 h-8 bg-white border border-slate-200 rounded-lg shadow text-lg font-bold text-slate-700 hover:bg-slate-50 flex items-center justify-center">−</button>
            </div>
            <div className="absolute bottom-3 right-3 z-10 text-[10px] font-mono text-slate-400 bg-white/70 rounded px-1.5 py-0.5 border border-slate-200">
              {Math.round(zoom * 100)}%
            </div>
            {polyMetaSorted.length === 0 ? (
              <div className="text-center text-slate-500 text-[13px]"><Icon name="poly" size={32} className="mx-auto mb-2 text-slate-300" />لا توجد مضلعات في الطبقات المرئية</div>
            ) : (
              <svg ref={svgRef} xmlns="http://www.w3.org/2000/svg"
                viewBox={`${previewVbX} ${previewVbY} ${vbW/zoom} ${vbH/zoom}`}
                preserveAspectRatio="xMidYMid meet"
                onClick={handleSvgClick}
                style={{
  background: "white",
  width: "100%",
  height: "100%",
  overflow: "visible",
  boxShadow: "0 8px 24px -10px rgba(15,23,42,0.25)",
  cursor: mode === "label" ? "crosshair" : "default"
}}>
                <defs>
                  {/* Generate one hatch pattern per unique layer-pattern index actually used */}
                  {HATCH_PATTERNS.map((pat, idx) => {
                    // Compute a reasonable representative spacing: median of polys on this layer
                    const layerPolys = polyMetaSorted.filter(p => p.layerPatternIdx === idx);
                    const sp = layerPolys.length > 0
                      ? layerPolys.map(p => p.hatchSpacing).sort((a,b)=>a-b)[Math.floor(layerPolys.length/2)]
                      : dimMax * 0.012;
                    const sw = Math.max(sp * 0.08, strokeWidth * 0.7);
                    return (
                      <pattern key={idx} id={`cadHatch${idx}`} patternUnits="userSpaceOnUse" width={sp} height={sp} patternTransform={`rotate(${pat.angle})`}>
                        <line x1="0" y1="0" x2="0" y2={sp} stroke="black" strokeWidth={sw} />
                      </pattern>
                    );
                  })}
                </defs>
{polyMetaPreview.map(p => {
  const patId = `cadHatch${p.layerPatternIdx}`;
  const fill = hatchedIds.has(p.id) ? `url(#${patId})` : "white";
  const sw = Math.max(1.6 * strokeScale, 1.25);

  return (
    <g key={p.id}>
      <path
        d={ringToPath(p.rings[0])}
        fill={fill}
        stroke="black"
        strokeWidth={sw}
        vectorEffect="non-scaling-stroke"
        strokeLinejoin="round"
        strokeLinecap="round"
        strokeMiterlimit="10"
        shapeRendering="geometricPrecision"
        style={{ cursor: mode === "hatch" ? "pointer" : "inherit" }}
        onClick={e => {
          if (mode === "hatch") {
            e.stopPropagation();
            handlePolyClick(p);
          }
        }}
      />

      {p.rings.slice(1).map((ring, ri) => (
        <path
          key={ri}
          d={ringToPath(ring)}
          fill="white"
          stroke="black"
          strokeWidth={sw}
          vectorEffect="non-scaling-stroke"
          strokeLinejoin="round"
          strokeLinecap="round"
          strokeMiterlimit="10"
          shapeRendering="geometricPrecision"
          pointerEvents="none"
        />
      ))}
    </g>
  );
})}
                {/* North arrow */}
                <g transform={`translate(${naXPreview} ${naYPreview})`}>
                  <text x="0" y={-naSize * 1.18} textAnchor="middle" dominantBaseline="alphabetic" fontSize={naSize * 0.55} fontFamily="Arial, sans-serif" fontWeight="bold" fill="black">N</text>
                  <polygon points={`0,${-naSize} ${-naSize*0.42},${naSize*0.42} 0,${naSize*0.18} ${naSize*0.42},${naSize*0.42}`} fill="black" stroke="black" strokeWidth={strokeWidth} strokeLinejoin="round" />
                </g>
              </svg>
            )}
            {/* HTML label overlays — recomputed from sceneX/Y every render via CTM
                so they stay pinned to the drawing regardless of zoom or pan.        */}
            {svgRef.current && (() => {
              const svg = svgRef.current;
              const ctm = svg.getScreenCTM();
              const wrapRect = wrapperRef.current?.getBoundingClientRect();
              if (!ctm || !wrapRect) return null;
              return [...labelItems.entries()].map(([id, item]) => {
                const isSelected = selectedLabel === id;
                // sceneX/Y → preview space (طرح vbX/vbY) → شاشة عبر CTM
                const pt = svg.createSVGPoint();
                pt.x = item.sceneX - vbX;
                pt.y = item.sceneY - vbY;
                const screen = pt.matrixTransform(ctm);
                const left = screen.x - wrapRect.left;
                const top  = screen.y - wrapRect.top;
                return (
                  <div key={id} style={{
                    position:"absolute", left, top,
                    transform:"translate(-50%,-50%)",
                    fontSize: item.fontPx, fontFamily:"Arial,sans-serif", fontWeight:"bold",
                    color:"black", textShadow:"0 0 4px white,0 0 8px white",
                    whiteSpace:"nowrap", cursor:"move", userSelect:"none",
                    outline: isSelected ? "2px dashed #2563eb" : "none",
                    padding:"2px 4px", lineHeight:1, zIndex:20,
                  }}
                    onClick={e => { e.stopPropagation(); setSelectedLabel(id); }}
                    onMouseDown={e => { e.stopPropagation(); onLabelMouseDown(e, id); }}
                  >
                    {item.text}
                    {isSelected && (
                      <>
                        <span title="حذف" style={{position:"absolute",top:-8,right:-8,width:16,height:16,background:"#ef4444",color:"white",borderRadius:4,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}
                          onClick={e => { e.stopPropagation(); setLabelItems(p => { const n=new Map(p); n.delete(id); return n; }); setSelectedLabel(null); }}>✕</span>
                        <span title="تغيير الحجم" style={{position:"absolute",bottom:-8,right:-8,width:16,height:16,background:"#2563eb",color:"white",borderRadius:4,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"se-resize"}}
                          onMouseDown={e => { e.stopPropagation(); onResizeMouseDown(e, id); }}>◢</span>
                      </>
                    )}
                  </div>
                );
              });
            })()}
            {/* Floating inline label editor */}
            {inlineInput && (() => {
              const wrect = wrapperRef.current?.getBoundingClientRect();
              const wrapW = wrect?.width || 0, wrapH = wrect?.height || 0;
              const inputW = 220;
              const left = Math.max(8, Math.min(wrapW - inputW - 8, inlineInput.screenXWrap - 8));
              const top  = Math.max(8, Math.min(wrapH - 60, inlineInput.screenYWrap - labelPx * 1.6));
              return (
                <div className="absolute z-30 pointer-events-auto" style={{ left, top }}>
                  <input
                    ref={inputRef}
                    type="text"
                    value={inlineInput.value}
                    onChange={e => setInlineInput(s => s ? { ...s, value: e.target.value } : s)}
                    onKeyDown={e => {
                      if (e.key === "Enter") { e.preventDefault(); commitInline(); }
                      else if (e.key === "Escape") { e.preventDefault(); cancelInline(); }
                    }}
                    onBlur={() => commitInline()}
                    placeholder="اكتب الترميز…"
                    autoFocus
                    style={{
                      width: 200, padding: "6px 10px", borderRadius: 8,
                      border: "2px solid #2563eb", background: "white",
                      fontSize: 14, fontWeight: 600, fontFamily: "Arial, sans-serif",
                      color: "#0f172a", outline: "none",
                      boxShadow: "0 6px 16px -6px rgba(15,23,42,0.35)", textAlign: "center",
                    }}
                    dir="rtl"
                  />
                </div>
              );
            })()}
          </main>
        </div>
        <footer className="px-5 py-3 border-t border-slate-200 flex items-center justify-between gap-3 bg-slate-50/50">
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-[13px] font-medium text-slate-600 hover:bg-slate-100">إلغاء</button>
          <button onClick={exportPNG} disabled={polyMetaSorted.length === 0} className="px-5 py-2 rounded-lg text-[13px] font-semibold bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2">
            <Icon name="download" size={15} /><span>تصدير PNG</span>
          </button>
        </footer>
      </div>
    </div>
  );
};

/* ──────────────────────────────────────────────────────────────────────────
   CRS WARNING MODAL — shown when a loaded Shapefile uses an unacceptable CRS
   Only UTM Zone 35 / 36 / 37 are accepted for project requirements.
   ────────────────────────────────────────────────────────────────────────── */
const CrsWarningModal = ({ data, onClose }) => {
  if (!data) return null;
  return (
    <div
      className="fixed inset-0 z-[2500] grid place-items-center p-4"
      style={{
        background: "rgba(185, 28, 28, 0.55)",
        backdropFilter: "blur(12px)",
        WebkitBackdropFilter: "blur(12px)",
      }}
    >
      <div
        className="w-full max-w-lg overflow-hidden rounded-2xl shadow-2xl"
        style={{ border: "2.5px solid rgba(239,68,68,0.7)" }}
        onClick={(e) => e.stopPropagation()}
        dir="rtl"
      >
        {/* ── Header ── */}
        <div className="px-6 py-5" style={{ background: "linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%)" }}>
          <div className="flex items-center gap-4">
            <div
              className="w-14 h-14 rounded-2xl grid place-items-center shrink-0"
              style={{ background: "rgba(255,255,255,0.12)", border: "2px solid rgba(255,255,255,0.25)" }}
            >
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <path d="M12 9v4M12 17h.01"/>
              </svg>
            </div>
            <div className="min-w-0 flex-1">
              <div className="text-white font-bold text-[17px] leading-snug">
                نظام الإحداثيات غير مقبول
              </div>
              <div className="text-red-200 text-[12.5px] mt-1 leading-relaxed">
                الطبقات التالية لا تستخدم نظام إحداثيات مقبولاً لمتطلبات المشروع
              </div>
            </div>
          </div>
        </div>

        {/* ── Accepted notice ── */}
        <div
          className="px-6 py-3 flex items-center gap-3"
          style={{ background: "rgba(254,226,226,0.95)", borderBottom: "1px solid rgba(239,68,68,0.25)" }}
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
          </svg>
          <span className="text-[12.5px] font-semibold text-red-800">
            الأنظمة المقبولة فقط:&nbsp;
            <span className="font-mono bg-red-100 px-2 py-0.5 rounded-md text-red-900">UTM Zone 35</span>
            &nbsp;&nbsp;
            <span className="font-mono bg-red-100 px-2 py-0.5 rounded-md text-red-900">UTM Zone 36</span>
            &nbsp;&nbsp;
            <span className="font-mono bg-red-100 px-2 py-0.5 rounded-md text-red-900">UTM Zone 37</span>
          </span>
        </div>

        {/* ── Layer list ── */}
        <div className="px-5 py-4 max-h-[38vh] overflow-y-auto space-y-2.5 scroll-thin" style={{ background: "rgba(255,255,255,0.97)" }}>
          {data.items.map((item, i) => {
            const crsLabel = item.crs
              ? (item.crs.long || item.crs.short || "غير معروف")
              : "غير معروف";
            const isGeo = item.crs && item.crs.kind === "GEOGRAPHIC";
            const isUnk = !item.crs || item.crs.kind === "UNKNOWN";
            const badge = isUnk ? "غير معروف" : isGeo ? "جغرافي (WGS84 / ...)" : crsLabel;
            return (
              <div
                key={i}
                className="rounded-xl p-3.5"
                style={{
                  background: "rgba(254,242,242,0.9)",
                  border: "1.5px solid rgba(239,68,68,0.35)",
                }}
              >
                <div className="flex items-start gap-2.5">
                  <div
                    className="w-7 h-7 rounded-lg grid place-items-center shrink-0 mt-0.5"
                    style={{ background: "#fca5a5" }}
                  >
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7f1d1d" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                      <path d="M12 9v4M12 17h.01"/>
                    </svg>
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="text-[13.5px] font-bold text-red-900 truncate leading-tight">{item.name}</div>
                    <div className="mt-1 inline-flex items-center gap-1.5 bg-red-100 border border-red-200 rounded-md px-2 py-0.5">
                      <span className="text-[10.5px] text-red-500 font-medium">النظام المكتشف:</span>
                      <span className="text-[11px] font-mono font-bold text-red-800">{badge}</span>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* ── Footer ── */}
        <div
          className="px-6 py-4 flex items-center justify-end gap-3"
          style={{ background: "rgba(255,255,255,0.97)", borderTop: "1px solid rgba(239,68,68,0.2)" }}
        >
          <button
            onClick={onClose}
            className="px-5 py-2.5 rounded-xl text-[13px] font-bold text-white transition"
            style={{ background: "linear-gradient(135deg, #b91c1c 0%, #dc2626 100%)", boxShadow: "0 4px 14px -4px rgba(185,28,28,0.6)" }}
          >
            فهمت
          </button>
        </div>
      </div>
    </div>
  );
};

/* ──────────────────────────────────────────────────────────────────────────
   MOVE-LAYERS PANEL — opens from the top-right toolbar; lets the reviewer
   pick visible layers and drag them across the map (visual-only).
   ────────────────────────────────────────────────────────────────────────── */
const MovePanel = ({ layers, selected, onToggle, onSelectAll, onStart, onClose }) => {
  const allSelected = layers.length > 0 && layers.every(l => selected.has(l.id));
  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-xl w-[280px] overflow-hidden flex flex-col">
      <div className="flex items-center gap-2 px-3 py-2.5 border-b border-[var(--line-2)]">
        <span className="grid place-items-center w-8 h-8 rounded-lg bg-slate-900 text-white shrink-0">
          <Icon name="move" size={15} />
        </span>
        <div className="flex-1 min-w-0">
          <div className="text-[13px] font-bold text-slate-900 leading-tight">تحريك الشيب فايل</div>
          <div className="text-[10.5px] text-slate-500 mt-0.5">اختر الطبقات ثم اسحبها على الخريطة</div>
        </div>
        <button
          onClick={onClose}
          className="w-8 h-8 grid place-items-center rounded-md text-slate-500 hover:bg-slate-100"
          aria-label="إغلاق"
        >
          <Icon name="close" size={16} />
        </button>
      </div>

      {layers.length > 1 && (
        <button
          onClick={() => onSelectAll(!allSelected)}
          className="flex items-center gap-2 px-3 py-2 text-right text-[11.5px] text-slate-600 hover:bg-slate-50 border-b border-[var(--line-2)] font-mono"
        >
          <span className={`w-3.5 h-3.5 rounded border-2 grid place-items-center shrink-0 transition ${
            allSelected ? "bg-slate-900 border-slate-900" : "bg-white border-slate-300"
          }`}>
            {allSelected && <Icon name="check" size={9} className="text-white" />}
          </span>
          {allSelected ? "إلغاء تحديد الكل" : "تحديد الكل"}
        </button>
      )}

      <div className="max-h-[36vh] overflow-y-auto scroll-thin p-2 bg-slate-50/40">
        {layers.length === 0 ? (
          <div className="text-center py-6 px-2">
            <Icon name="layers" size={22} className="mx-auto text-slate-300 mb-1.5" />
            <div className="text-[12px] text-slate-500 leading-relaxed">
              لا توجد طبقات مرئية للتحريك.
            </div>
          </div>
        ) : (
          <div className="space-y-1.5">
            {layers.map(l => {
              const isSel = selected.has(l.id);
              const geom  = GEOM_TYPES[l.geomType] || { txt: "هندسة", icon: "file" };
              return (
                <button
                  key={l.id}
                  onClick={() => onToggle(l.id)}
                  className={`w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg border transition text-right ${
                    isSel
                      ? "bg-[var(--accent-soft)] border-[color:oklch(0.85_0.05_195)]"
                      : "bg-white border-slate-200 hover:border-slate-300"
                  }`}
                >
                  <span className={`w-4 h-4 rounded-md border-2 grid place-items-center shrink-0 transition ${
                    isSel ? "bg-[var(--accent)] border-[var(--accent)]" : "bg-white border-slate-300"
                  }`}>

                      <span className="font-mono">{l.count}</span>
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>

      <div className="p-2.5 border-t border-[var(--line-2)] bg-white flex items-center gap-2">
        <button
          onClick={onClose}
          className="flex-1 h-9 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-semibold text-slate-700 transition"
        >
          إلغاء
        </button>
        <button
          onClick={onStart}
          disabled={selected.size === 0}
          className="flex-1 h-9 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[12.5px] font-semibold disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center justify-center gap-1.5"
        >
          <Icon name="move" size={13} />
          ابدأ التحريك
          {selected.size > 0 && (
            <span className="font-mono text-[10.5px] bg-white/20 rounded px-1 py-px">{selected.size}</span>
          )}
        </button>
      </div>
    </div>
  );
};

// Mapbox يحتاج token في Leaflet. اتركه فاضي لو مش هتستخدمه.
const MAPBOX_TOKEN = "";

const BASEMAPS = {
  google: {
    label: "Google Earth",
    sub: "World Imagery",
    icon: "🌍",
  },
  esri: {
    label: "Esri Satellite",
    sub: "World Imagery",
    icon: "🛰️",
  },
  bing: {
    label: "Bing Satellite",
    sub: "World Imagery",
    icon: "🛰️",
  },
};

function bingQuadKey(x, y, z) {
  let quadKey = "";
  for (let i = z; i > 0; i--) {
    let digit = 0;
    const mask = 1 << (i - 1);
    if ((x & mask) !== 0) digit += 1;
    if ((y & mask) !== 0) digit += 2;
    quadKey += digit;
  }
  return quadKey;
}

const BingSatelliteLayer = L.TileLayer.extend({
  getTileUrl(coords) {
    const z = coords.z;
    const limit = 1 << z;
    const x = ((coords.x % limit) + limit) % limit;
    const y = coords.y;
    const q = bingQuadKey(x, y, z);
    const s = this.options.subdomains[Math.abs(x + y) % this.options.subdomains.length];

    return `https://ecn.t${s}.tiles.virtualearth.net/tiles/a${q}.jpeg?g=13521&n=z`;
  },
});

function createBaseMapLayer(type) {
  if (type === "esri") {
return L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxNativeZoom: 17,   // جرب 17 بدل 19
    maxZoom: 30,
    crossOrigin: true,
    updateWhenZooming: false,
    updateInterval: 0,
    attribution: "@جميع الحقوق محفوظة لدى حناوى و فوكس الحكيم",
  }
);
  }

  if (type === "bing") {
    return new BingSatelliteLayer("", {
      maxNativeZoom: 19,
      maxZoom: 28,
      subdomains: ["0", "1", "2", "3"],
      crossOrigin: true,
        attribution: "@جميع  الحقوق محفوظه لدى حناوى و فوكس الحكيم",
    });
  }

  if (type === "mapbox") {
    if (!MAPBOX_TOKEN) {
      throw new Error("MAPBOX_TOKEN_REQUIRED");
    }

    return L.tileLayer(
      `https://api.mapbox.com/styles/v1/mapbox/satellite-v9/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`,
      {
        tileSize: 512,
        zoomOffset: -1,
        maxNativeZoom: 22,
        maxZoom: 28,
        crossOrigin: true,
        attribution: "Mapbox Satellite",
      }
    );
  }

  // Default: Google Earth / Google Satellite
  return L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", {
    maxNativeZoom: 21,
    maxZoom: 28,
    crossOrigin: true,
    subdomains: ["0", "1", "2", "3"],
        attribution: "@جميع  الحقوق محفوظه لدى حناوى و فوكس الحكيم",
  });
}

const [baseMap, setBaseMap] = useState("google");
const [baseMapOpen, setBaseMapOpen] = useState(false);

useEffect(() => {

     // {id,name,kind,color,visible,count,leafletLayer,geojson?,points?}
  const [mobileOpen, setMobileOpen] = useState(false);

  const [globalDrag, setGlobalDrag] = useState(false);
  const dragCounterRef = useRef(0);

  useEffect(() => {
    const onDragEnter = (e) => {

const onDrop = (e) => {

};
    window.addEventListener("dragenter", onDragEnter);

    return () => {

      window.removeEventListener("dragover",  onDragOver);

  }, [layers]);

  /* ── Live tolerance watcher ──
     Re-colors every geodesy point and rebuilds its popup with the current
     distance-to-nearest-edge whenever the user changes the tolerance,
     toggles a layer, or adds a new sheet/shapefile. */
  useEffect(() => {
    const allPolygons = layers
      .filter(l => l.visible && l.polysData && l.polysData.length > 0)
      .flatMap(l => l.polysData.map(p => ({
        rings: p.rings, zone: l.zone, hemi: l.hemi,

    layers.forEach(l => {
      if (l.kind !== "sheet" || !l.leafletLayer) return;

        if (!marker.getLatLng || !marker._sheetMeta) return;

        const latlng = marker.getLatLng();
        const point  = [latlng.lng, latlng.lat];

        let distM = null, onEdge = false;
        if (allPolygons.length > 0) {
          const d = minDistanceToAnyPolygonEdge(point, allPolygons);
          if (isFinite(d)) { distM = d; onEdge = d <= tolerance; }
        }

        marker.setStyle({
          fillColor: distM == null ? (meta.baseColor || "#3b82f6") : (onEdge ? "#16a34a" : "#dc2626"),
          color: "#fff", weight: 1.6, fillOpacity: 0.95,
        });

        const coordsHtml = meta.projected
          ? `E ${meta.E.toFixed(3)} · N ${meta.N.toFixed(3)}<br/>UTM ${meta.utmZ}${meta.utmH}`
          : `${meta.lat.toFixed(6)}, ${meta.lon.toFixed(6)}`;

        const distHtml = distM == null ? "" : `
          <div style="margin-top:8px;padding-top:6px;border-top:1px solid #e2e8f0">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0">
              <span style="color:#64748b;font-size:11.5px">المسافة عن أقرب حافة</span>
              <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:${onEdge ? "#16a34a" : "#dc2626"}">${distM.toFixed(3)} <span style="color:#94a3b8;font-weight:500;font-size:11px">م</span></span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:1px 0">
              <span style="color:#94a3b8;font-size:11px">السماحية الحالية</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b">${tolerance.toFixed(2)} م</span>
            </div>
            <div style="margin-top:5px;font-size:11.5px;font-weight:700;color:${onEdge ? "#16a34a" : "#dc2626"};text-align:center">
              ${onEdge ? "✓ على الحافة (داخل السماحية)" : "✗ خارج السماحية"}
            </div>
          </div>`;

        const html = `
          <div style="min-width:210px;direction:rtl;text-align:right">
            ${meta.label ? `<div style="font-weight:600;margin-bottom:4px">${meta.label}</div>` : ""}
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#475569;direction:ltr;text-align:left">${coordsHtml}</div>
            ${meta.desc ? `<div style="margin-top:6px;color:#334155;font-size:11.5px">${meta.desc}</div>` : ""}
            ${distHtml}
          </div>`;

        if (marker.getPopup()) marker.setPopupContent(html);
        else marker.bindPopup(html);
      });
    });
  }, [layers, tolerance]);

  /* ----- Shapefile style settings ----- */
  const [shpSettingsOpen, setShpSettingsOpen] = useState(false);
  const [shpFillColor,    setShpFillColor]    = useState("#2563eb");
  const [shpFillOpacity,  setShpFillOpacity]  = useState(0.28);
  const [shpOutlineColor, setShpOutlineColor] = useState("#2563eb");
  const [shpPtColor,      setShpPtColor]      = useState("#2563eb");
  const [shpPtRadius,     setShpPtRadius]     = useState(5);
  const [shpPtShape,      setShpPtShape]      = useState("circle"); // circle | square | diamond

  /** Apply current style settings to all visible shapefile layers */
  const applyShpStyle = (patch) => {
    const s = {
      fillColor:    (patch.fillColor    ?? shpFillColor),
      fillOpacity:  (patch.fillOpacity  ?? shpFillOpacity),
      outlineColor: (patch.outlineColor ?? shpOutlineColor),
      ptColor:      (patch.ptColor      ?? shpPtColor),
      ptRadius:     (patch.ptRadius     ?? shpPtRadius),
      ptShape:      (patch.ptShape      ?? shpPtShape),
    };
    const ptSize = s.ptRadius * 2;
    setLayers(prev => prev.map(l => {
      if (l.kind !== "shapefile" || !l.geoLayer) return l;
      l.geoLayer.eachLayer(sub => {
        if (sub.setRadius) {
          // circleMarker (shapefile points)
          if (s.ptShape === "circle") {
            sub.setStyle({ fillColor: s.ptColor, color: "#fff", weight: 1.5, fillOpacity: 1 });
            sub.setRadius(s.ptRadius);
          } else {
            // Replace with divIcon for square / diamond
            const rot = s.ptShape === "diamond" ? "rotate(45deg)" : "none";
            const icon = L.divIcon({
              className: "",
              html: `<div style="width:${ptSize}px;height:${ptSize}px;background:${s.ptColor};border:2px solid #fff;border-radius:${s.ptShape==="square"?"3px":"0"};transform:${rot};box-shadow:0 0 0 1px rgba(0,0,0,0.2)"></div>`,
              iconSize: [ptSize, ptSize],
              iconAnchor: [ptSize/2, ptSize/2],
            });
            // Only markers (L.Marker) can use setIcon; circleMarkers can't
            // So we swap setStyle for visual approximation via radius + color
            sub.setStyle({ fillColor: s.ptColor, color: "#fff", weight: 1.5, fillOpacity: 1 });
            sub.setRadius(s.ptRadius);
          }
        } else if (sub.setStyle) {
          // polygon / polyline
          sub.setStyle({
            color:       s.outlineColor,
            fillColor:   s.fillColor,
            fillOpacity: s.fillOpacity,
            weight: 2.5, opacity: 1,
          });
        }
      });
      return { ...l, color: s.fillColor };
    }));
  };

  const shpStyleRef = useRef({});
  useEffect(() => {
    shpStyleRef.current = { fillColor: shpFillColor, fillOpacity: shpFillOpacity, outlineColor: shpOutlineColor, ptColor: shpPtColor, ptRadius: shpPtRadius, ptShape: shpPtShape };
  }, [shpFillColor, shpFillOpacity, shpOutlineColor, shpPtColor, shpPtRadius, shpPtShape]);

  /* ----- Move-layers tool ----- */
  const [movePanelOpen, setMovePanelOpen] = useState(false);
  const [moveActive, setMoveActive]       = useState(false);
  const [moveSelected, setMoveSelected]   = useState(() => new Set());

  // History of drag sessions for undo / reset-to-original.
  // Each entry: { layerIds:[], dLat, dLng }. Survives exit/re-enter of move mode.
  const moveHistoryRef = useRef([]);
  const [movedOpsCount, setMovedOpsCount] = useState(0);

  const recordMoveOp = (layerIds, dLat, dLng) => {
    if (dLat === 0 && dLng === 0) return;
    moveHistoryRef.current.push({ layerIds: layerIds.slice(), dLat, dLng });
    setMovedOpsCount(moveHistoryRef.current.length);
  };
  const undoLastMove = () => {
    const op = moveHistoryRef.current.pop();
    if (!op) return;
    layers.forEach(l => {
      if (op.layerIds.includes(l.id)) translateFeatureGroup(l.leafletLayer, -op.dLat, -op.dLng);
    });
    setMovedOpsCount(moveHistoryRef.current.length);
    showToast("تم التراجع عن آخر تحريك", "ok", 1800);
  };
  const resetAllMoves = () => {
    if (moveHistoryRef.current.length === 0) return;
    // Replay every op in reverse, so even out-of-order sessions are undone correctly.
    const ops = moveHistoryRef.current.slice().reverse();
    ops.forEach(op => {
      layers.forEach(l => {
        if (op.layerIds.includes(l.id)) translateFeatureGroup(l.leafletLayer, -op.dLat, -op.dLng);
      });
    });
    moveHistoryRef.current = [];
    setMovedOpsCount(0);
    showToast("تم إرجاع الطبقات لأماكنها الأصلية", "ok");
  };

  const toggleMoveSelected = (id) => {
    setMoveSelected(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else              next.add(id);
      return next;
    });
  };
  const setAllMoveSelected = (on) => {
    setMoveSelected(on ? new Set(layers.filter(l => l.visible).map(l => l.id)) : new Set());
  };
  const startMove = () => {
    if (moveSelected.size === 0) { showToast("اختر طبقة واحدة على الأقل", "info"); return; }
    setMovePanelOpen(false);
    setMoveActive(true);
    showToast("اسحب على الخريطة لتحريك الطبقات المحددة", "info", 3200);
  };
  const endMove = () => {
    setMoveActive(false);
    setMoveSelected(new Set());
  };

  /* Drag-to-move effect: while active, the map's own drag is disabled and
     each mouse drag shifts the chosen layers visually. */
  useEffect(() => {
    if (!moveActive) return;
    const map = mapRef.current;
    if (!map) return;
    const ids = Array.from(moveSelected);
    const targets = layers.filter(l => ids.includes(l.id) && l.visible);
    if (targets.length === 0) { setMoveActive(false); return; }

    map.dragging.disable();
    if (map.boxZoom) map.boxZoom.disable();
    const cont = map.getContainer();
    const prevCursor = cont.style.cursor;
    cont.style.cursor = "grab";

    // ── Suppress popups while moving ──
    // Close any currently open popup, then unbind popups from every sublayer
    // of the targeted groups. Save the HTML so we can rebind on cleanup.
    map.closePopup();
    const popupBackup = [];   // [{ lyr, content }]
    const walk = (lyr) => {
      // Leaf: has a bound popup → save + unbind
      if (lyr.getPopup && lyr.getPopup()) {
        const p = lyr.getPopup();
        const content = p.getContent ? p.getContent() : null;
        popupBackup.push({ lyr, content });
        lyr.unbindPopup();
      }
      // Recurse into child layers (FeatureGroup → GeoJSON → individual features)
      if (lyr.eachLayer) lyr.eachLayer(walk);
    };
    targets.forEach(l => { if (l.leafletLayer) walk(l.leafletLayer); });

    let dragging = false, last = null;
    let sessionDLat = 0, sessionDLng = 0;
    const onDown = (e) => {
      dragging = true; last = e.latlng;
      sessionDLat = 0; sessionDLng = 0;
      cont.style.cursor = "grabbing";
      L.DomEvent.stopPropagation(e.originalEvent);
    };
    const onMove = (e) => {
      if (!dragging || !last) return;
      const dLat = e.latlng.lat - last.lat;
      const dLng = e.latlng.lng - last.lng;
      last = e.latlng;
      sessionDLat += dLat; sessionDLng += dLng;
      targets.forEach(l => translateFeatureGroup(l.leafletLayer, dLat, dLng));
    };
    const onUp = () => {
      if (dragging && (sessionDLat !== 0 || sessionDLng !== 0)) {
        recordMoveOp(ids, sessionDLat, sessionDLng);
      }
      dragging = false; last = null;
      sessionDLat = 0; sessionDLng = 0;
      cont.style.cursor = "grab";
    };

    map.on("mousedown", onDown);
    map.on("mousemove", onMove);
    map.on("mouseup",   onUp);
    map.on("mouseout",  onUp);

    return () => {
      map.dragging.enable();
      if (map.boxZoom) map.boxZoom.enable();
      cont.style.cursor = prevCursor || "";
      map.off("mousedown", onDown);
      map.off("mousemove", onMove);
      map.off("mouseup",   onUp);
      map.off("mouseout",  onUp);
      // Restore popups that were unbound during move mode
      popupBackup.forEach(({ lyr, content }) => {
        try { if (content != null) lyr.bindPopup(content); } catch {}
      });
    };
  }, [moveActive, moveSelected, layers]);


  /** Set the current UTM zone from a representative [lon,lat]. */
  const updateZoneFromLonLat = (lonLat) => {
    if (!lonLat) return;
    const [lon, lat] = lonLat;
    if (!isFinite(lon) || !isFinite(lat)) return;
    const z = utmZoneFromLon(lon);
    const h = lat >= 0 ? "N" : "S";
    setUtmZone(z); setUtmHemi(h);
    registerUtm(z, h);
  };

  const showToast = useCallback((msg, tone = "info", ms = 2600) => {
    setToast({ msg, tone });
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => setToast(null), ms);
  }, []);

const switchBaseMap = useCallback((type) => {
  const map = mapRef.current;

  if (type === baseMap) {
    setBaseMapOpen(false);

  let nextLayer;

    nextLayer = createBaseMapLayer(type);

  if (oldLayer && map.hasLayer(oldLayer)) {
    try {
      map.removeLayer(oldLayer);
    } catch (err) {
      console.warn("Old basemap remove warning:", err);
    }

  setBaseMap(type);
  setBaseMapOpen(false);

  showToast(`تم تغيير الخريطة إلى ${BASEMAPS[type]?.label || "Satellite"}`, "ok", 1800);
}, [baseMap, showToast]);

  /* ----- Initialise map ----- */
  useEffect(() => {

    const map = L.map(mapEl.current, {
      center: [26.8206, 30.8025],   // Egypt
      zoom: 6,

      minZoom: 1,

    map.attributionControl.setPrefix(false);
    

// ترتيب الظهور النهائي:
// Popup > Sheet Points > North Line > Shapefile Points > Polygons > Map

map.getPane("popupPane").style.zIndex = 1100;

if (!map.getPane("sheetPointsPane")) {
  map.createPane("sheetPointsPane");
}
map.getPane("sheetPointsPane").style.zIndex = 1000;

if (!map.getPane("northPane")) {
  map.createPane("northPane");
}
map.getPane("northPane").style.zIndex = 900;

if (!map.getPane("shpPointsPane")) {
  map.createPane("shpPointsPane");
}
map.getPane("shpPointsPane").style.zIndex = 850;



 const initialBaseLayer = createBaseMapLayer("google");
initialBaseLayer.addTo(map);
baseLayerRef.current = initialBaseLayer;

    L.control.zoom({ position: "topleft" }).addTo(map);

    mapRef.current = map;
