        if (!l.visible) return;
        if (l.kind === "shapefile") {
          const c = geoJsonCentroid(l.geojson || []);
          if (c) { sums.x += c[0]; sums.y += c[1]; sums.n++; }
        } else if (l.kind === "sheet") {
          (l.points || []).forEach(([x, y]) => { sums.x += x; sums.y += y; sums.n++; });
        }
      });
      if (sums.n) {
        const mx = sums.x / sums.n, my = sums.y / sums.n;
        zone = utmZoneFromLon(mx); hemi = my >= 0 ? "N" : "S";
      }
    }
    if (!zone) { showToast("تعذّر تحديد نظام إحداثيات Shapefile", "err"); return; }
    registerUtm(zone, hemi);

    const reproject = (lonLat) => toUtm(lonLat, zone, hemi);

    const features = [];
    layers.forEach(l => {
      if (!l.visible) return;
      const lname = sanitizeLayerName(l.name);
      if (l.kind === "shapefile") {
        const collected = [];
        (l.geojson || []).forEach(fc => geoJsonToDxfFeatures(fc, lname, collected));
        collected.forEach(f => {
          if (f.type === "point")  f.coords = reproject(f.coords);
          else                     f.coords = f.coords.map(reproject);
          features.push(f);
        });
      } else if (l.kind === "sheet") {
        (l.points || []).forEach(([x, y]) => {
          features.push({ type: "point", coords: reproject([x, y]), layerName: lname });
        });
      }
    });
    if (features.length === 0) { showToast("الطبقات المرئية فارغة", "info"); return; }

    const dxf = buildDXF(features, { zone, hemi });
downloadBlob(
  new Blob([dxf], { type: "application/octet-stream" }),
  `map_UTM${zone}${hemi}.dxf`
);
    showToast(`تم تصدير ${features.length} عنصر · UTM Zone ${zone}${hemi}`, "ok", 3200);
  };

  /* ----- Export KML (polygons only, WGS84 lat/lon) ----- */
  const exportKML = () => {
    if (layers.length === 0) { showToast("لا توجد بيانات للتصدير", "info"); return; }

    const folders = [];
    let totalPolys = 0;
    layers.forEach(l => {
      if (!l.visible) return;
      if (l.kind !== "shapefile") return;     // sheets carry points only
      const polys = [];
      (l.geojson || []).forEach(fc => {
        (fc.features || []).forEach(feat => {
          const g = feat.geometry;
          if (!g) return;
          const props = feat.properties || {};
          if (g.type === "Polygon") {
            polys.push({ rings: g.coordinates, props });
          } else if (g.type === "MultiPolygon") {
            g.coordinates.forEach(poly => polys.push({ rings: poly, props }));
          }
        });
      });
      if (polys.length === 0) return;
      folders.push({ name: l.name, color: l.color, polys });
      totalPolys += polys.length;
    });

    if (totalPolys === 0) {
      showToast("لا توجد مضلعات (Polygons) في الطبقات المرئية", "info", 3500);
      return;
    }

    const kml = buildKML(folders);
    downloadBlob(new Blob([kml], { type: "application/vnd.google-earth.kml+xml" }), "polygons.kml");
    showToast(`تم تصدير ${totalPolys} مضلع إلى KML`, "ok", 3200);
  };

  /* ----- Export Shapefile (largest polygon = land boundary), zipped ----- */
  const exportShapefileZip = async () => {
    if (layers.length === 0) { showToast("لا توجد بيانات للتصدير", "info"); return; }

    // Pick the largest polygon across all visible shapefile layers.
    let biggest = null;
    let biggestLayerName = "boundary";
    let srcZone = null, srcHemi = "N";
    layers.forEach(l => {
      if (!l.visible || !l.polysData) return;
      for (const p of l.polysData) {
        if (!biggest || p.area > biggest.area) {
          biggest = p;
          biggestLayerName = sanitizeLayerName(l.name) || "boundary";
          srcZone = l.zone || null;
          srcHemi = l.hemi || "N";
        }
      }
    });
    if (!biggest) { showToast("لا توجد مضلعات لتصديرها", "info"); return; }

    // Reproject rings to the source layer's UTM zone (if any). Otherwise keep WGS84.
    let zone = srcZone, hemi = srcHemi;
    if (!zone) {
      // Fallback: derive from polygon centroid longitude
      const r0 = biggest.rings[0] || [];
      if (r0.length) {
        let sx = 0, sy = 0;
        r0.forEach(([x, y]) => { sx += x; sy += y; });
        const cx = sx / r0.length, cy = sy / r0.length;
        zone = utmZoneFromLon(cx); hemi = cy >= 0 ? "N" : "S";
      }
    }
    if (zone) registerUtm(zone, hemi);
    const projectPt = zone ? (c) => toUtm(c, zone, hemi) : (c) => [c[0], c[1]];

    // Shapefile spec: outer ring CW (negative signed area in math convention),
    // holes CCW. Normalize rings.
    const ringSignedArea = (r) => {
      let s = 0;
      for (let i = 0; i < r.length - 1; i++) {
        s += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
      }
      return s / 2;
    };
    const ensureClosed = (r) => {
      if (r.length === 0) return r;
      const [x0, y0] = r[0];
      const [xn, yn] = r[r.length - 1];
      if (x0 !== xn || y0 !== yn) return [...r, [x0, y0]];
      return r;
    };
    const rings = biggest.rings.map((r, idx) => {
      let ring = ensureClosed(r.map(projectPt));
      const a = ringSignedArea(ring);
      // outer (idx 0) should be CW (signed area < 0). holes should be CCW.
      if (idx === 0 && a > 0) ring = ring.slice().reverse();
      if (idx > 0  && a < 0) ring = ring.slice().reverse();
      return ring;
    });

    // BBox
    let xmin = Infinity, ymin = Infinity, xmax = -Infinity, ymax = -Infinity;
    let totalPoints = 0;
    rings.forEach(r => {
      totalPoints += r.length;
      r.forEach(([x, y]) => {
        if (x < xmin) xmin = x; if (x > xmax) xmax = x;
        if (y < ymin) ymin = y; if (y > ymax) ymax = y;
      });
    });

    // ── Build .shp ──
    const contentBytes = 4 + 32 + 4 + 4 + 4 * rings.length + 16 * totalPoints;
    const fileLengthBytes = 100 + 8 + contentBytes;
    const shpBuf = new ArrayBuffer(fileLengthBytes);
    const sdv = new DataView(shpBuf);
    sdv.setInt32(0, 9994, false);                  // file code BE
    sdv.setInt32(24, fileLengthBytes / 2, false);  // file length (16-bit words) BE
    sdv.setInt32(28, 1000, true);                  // version LE
    sdv.setInt32(32, 5, true);                     // shape type Polygon LE
    sdv.setFloat64(36, xmin, true);
    sdv.setFloat64(44, ymin, true);
    sdv.setFloat64(52, xmax, true);
    sdv.setFloat64(60, ymax, true);
    // record header
    sdv.setInt32(100, 1, false);                   // record number
    sdv.setInt32(104, contentBytes / 2, false);    // content length
    // record content
    let p = 108;
    sdv.setInt32(p, 5, true); p += 4;              // shape type
    sdv.setFloat64(p, xmin, true); p += 8;
    sdv.setFloat64(p, ymin, true); p += 8;
    sdv.setFloat64(p, xmax, true); p += 8;
    sdv.setFloat64(p, ymax, true); p += 8;
    sdv.setInt32(p, rings.length, true); p += 4;   // numParts
    sdv.setInt32(p, totalPoints, true); p += 4;    // numPoints
    let idx = 0;
    rings.forEach(r => { sdv.setInt32(p, idx, true); p += 4; idx += r.length; });
    rings.forEach(r => {
      r.forEach(([x, y]) => {
        sdv.setFloat64(p, x, true); p += 8;
        sdv.setFloat64(p, y, true); p += 8;
      });
    });

    // ── Build .shx ──
    const shxLen = 100 + 8;
    const shxBuf = new ArrayBuffer(shxLen);
    const xdv = new DataView(shxBuf);
    xdv.setInt32(0, 9994, false);
    xdv.setInt32(24, shxLen / 2, false);
    xdv.setInt32(28, 1000, true);
    xdv.setInt32(32, 5, true);
    xdv.setFloat64(36, xmin, true);
    xdv.setFloat64(44, ymin, true);
    xdv.setFloat64(52, xmax, true);
    xdv.setFloat64(60, ymax, true);
    xdv.setInt32(100, 50, false);                  // offset (16-bit words) = 100 bytes / 2
    xdv.setInt32(104, contentBytes / 2, false);    // content length

    // ── Build .dbf (one record, one ID field) ──
    const dbfHeaderLen = 32 + 32 + 1;              // header + 1 field desc + terminator
    const dbfRecordLen = 1 + 10;                   // deletion flag + ID(10)
    const dbfLen = dbfHeaderLen + dbfRecordLen + 1;
    const dbfBuf = new ArrayBuffer(dbfLen);
    const ddv = new DataView(dbfBuf);
    const dArr = new Uint8Array(dbfBuf);
    ddv.setUint8(0, 0x03);                         // dBase III
    const now = new Date();
    ddv.setUint8(1, now.getFullYear() - 1900);
    ddv.setUint8(2, now.getMonth() + 1);
    ddv.setUint8(3, now.getDate());
    ddv.setInt32(4, 1, true);                      // num records
    ddv.setInt16(8, dbfHeaderLen, true);           // header length
    ddv.setInt16(10, dbfRecordLen, true);          // record length
    // Field descriptor: 'ID' Numeric(10,0)
    const fname = "ID";
    for (let i = 0; i < fname.length; i++) dArr[32 + i] = fname.charCodeAt(i);
    dArr[32 + 11] = 0x4E;                          // 'N'
    ddv.setUint8(32 + 16, 10);                     // field length
    ddv.setUint8(32 + 17, 0);                      // decimal count
    dArr[64] = 0x0D;                               // header terminator
    // Record
    dArr[65] = 0x20;                               // not deleted
    const idStr = "         1";                    // right-aligned 10 chars
    for (let i = 0; i < 10; i++) dArr[66 + i] = idStr.charCodeAt(i);
    dArr[dbfLen - 1] = 0x1A;                       // EOF

    // ── PRJ ──
    // If we reprojected to UTM, write the ESRI WKT for WGS84 UTM Zone NN N/S.
    // Otherwise fall back to WGS 84 geographic.
    let prj;
    if (zone) {
      const centralMeridian = (zone - 1) * 6 - 180 + 3;
      const falseNorthing = (hemi === "S") ? 10000000.0 : 0.0;
      const hemiLetter = hemi === "S" ? "S" : "N";
      prj = `PROJCS["WGS_1984_UTM_Zone_${zone}${hemiLetter}",`
          + `GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",`
          + `SPHEROID["WGS_1984",6378137.0,298.257223563]],`
          + `PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]],`
          + `PROJECTION["Transverse_Mercator"],`
          + `PARAMETER["False_Easting",500000.0],`
          + `PARAMETER["False_Northing",${falseNorthing}],`
          + `PARAMETER["Central_Meridian",${centralMeridian}],`
          + `PARAMETER["Scale_Factor",0.9996],`
          + `PARAMETER["Latitude_Of_Origin",0.0],`
          + `UNIT["Meter",1.0]]`;
    } else {
      prj = 'GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]]';
    }

    // ── Zip ──
    const base = biggestLayerName.replace(/[^A-Za-z0-9_\-]+/g, "_") || "boundary";
    const suffix = zone ? `_UTM${zone}${hemi}` : "_WGS84";
    const zip = new JSZip();
    zip.file(`${base}.shp`, shpBuf);
    zip.file(`${base}.shx`, shxBuf);
    zip.file(`${base}.dbf`, dbfBuf);
    zip.file(`${base}.prj`, prj);
    try {
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
      downloadBlob(blob, `${base}_boundary${suffix}.zip`);
      const crsLabel = zone ? `UTM Zone ${zone}${hemi}` : "WGS 84";
      showToast(`تم تصدير Shapefile (${totalPoints} نقطة · ${crsLabel})`, "ok", 3200);
    } catch (e) {
      console.error(e);
      showToast("فشل ضغط الـ Shapefile", "err");
    }
  };

  /* ----- Sidebar content ----- */
  const sidebar = (
    <aside className="h-full w-full lg:w-[340px] shrink-0 bg-[var(--panel)] border-l border-[var(--line)] flex flex-col">
      {/* Brand */}
      <header className="px-5 pt-5 pb-4 border-b border-[var(--line)]">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl grid place-items-center text-white shadow-sm"
               style={{ background: "linear-gradient(135deg, var(--accent), oklch(0.45 0.10 215))" }}>
            <Icon name="compass" size={22} />
          </div>
          <div className="min-w-0">
            <div className="text-[15px] font-bold text-slate-900 leading-tight">دليل المراجع الذكي</div>
            <div className="text-[11px] text-slate-500 mt-0.5 font-mono tracking-tight">SMART REFERENCE GUIDE</div>
          </div>
          <button
            onClick={() => setMobileOpen(false)}
            className="lg:hidden mr-auto grid place-items-center w-9 h-9 rounded-md text-slate-500 hover:bg-slate-100"
            aria-label="إغلاق"
          >
            <Icon name="close" size={20} />
          </button>
          {/* Theme toggle — always visible */}
          <button
            onClick={toggleTheme}
            title={isDark ? "تبديل للوضع الفاتح" : "تبديل للوضع الداكن"}
            className="grid place-items-center w-9 h-9 rounded-xl border border-[var(--line)] bg-[var(--panel-2)] hover:bg-[var(--line-2)] transition shrink-0"
            style={{ marginRight: "auto" }}
          >
            {isDark ? (
              /* sun icon */
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
            ) : (
              /* moon icon */
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            )}
          </button>
        </div>
      </header>

      {/* Actions (scrollable middle) */}
      <div className="flex-1 min-h-0 overflow-y-auto scroll-thin px-4 py-4 space-y-4">
        {/* ── Export section ── */}
        <section className="space-y-2">
          <SectionLabel>تصدير</SectionLabel>
          <div className="grid grid-cols-2 gap-2">
            <ExportTile
              icon="image"
              label="صورة أوتوكاد"
              sub="PNG"
              title="مخطط أبيض وأسود مع سهم شمال، ترميز، وتهشير"
              onClick={() => setCadOpen(true)}
            />
            <ExportTile
              icon="cad"
              label="ملف كاد"
              sub={`DXF${utmZone ? ` · UTM${utmZone}${utmHemi}` : ""}`}
              title={`ملف DXF بإحداثيات Shapefile الأصلية${utmZone ? ` (UTM Zone ${utmZone}${utmHemi})` : ""}`}
              onClick={exportDXF}
            />
            <ExportTile
              icon="globe"
              label="Google Earth"
              sub="KML · WGS 84"
              title="ملف KML يحتوي على المضلعات فقط (WGS 84) — جاهز لـ Google Earth"
              onClick={exportKML}
            />
            <ExportTile
              icon="poly"
              label="Shapefile"
              sub={`ZIP${utmZone ? ` · UTM${utmZone}${utmHemi}` : ""}`}
              title={`حدود الأرض (أكبر مضلع) — بنفس إحداثيات Shapefile الأصلية${utmZone ? ` (UTM Zone ${utmZone}${utmHemi})` : ""} · ZIP`}
              onClick={exportShapefileZip}
            />
          </div>
        </section>

        {/* ── Settings section ── */}
        <section className="space-y-2">
          <SectionLabel>إعدادات</SectionLabel>

          {/* Geodesy tolerance — compact row */}
          <div className="rounded-xl border border-slate-200 bg-white px-3 py-2.5 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <span className="grid place-items-center w-8 h-8 rounded-lg bg-slate-50 text-slate-700 shrink-0">
                <Icon name="land-plot" size={16} />
              </span>
              <div className="min-w-0">
                <div className="text-[12.5px] font-semibold text-slate-900 leading-tight">سماحية الجيوديسيا</div>
                <div className="text-[10.5px] text-slate-500 leading-tight mt-0.5">المسافة المسموحة عن الحافة</div>
              </div>
            </div>
            <div className="flex items-center gap-1 shrink-0">
              <button
                onClick={() => setTolerance(t => Math.max(0.00, parseFloat((t - 0.05).toFixed(2))))}
                className="w-6 h-6 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-base grid place-items-center"
              >−</button>
              <span className="font-mono text-[12px] font-semibold text-slate-900 w-12 text-center">
                {tolerance.toFixed(2)}م
              </span>
              <button
                onClick={() => setTolerance(t => parseFloat((t + 0.05).toFixed(2)))}

          {/* North-edge (Bahri) toggle — compact row */}
          <button
            onClick={toggleNorthEdges}
            className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 flex items-center gap-2.5 hover:bg-slate-50 transition text-right"
          >
            <span className="grid place-items-center w-8 h-8 rounded-lg bg-slate-50 text-slate-700 shrink-0 relative">
              <Icon name="compass" size={16} />
              <span className="absolute -bottom-0.5 left-0.5 w-3 h-[3px] rounded-full" style={{ background: "#fde047" }}></span>
            </span>
            <div className="min-w-0 flex-1">
              <div className="text-[12.5px] font-semibold text-slate-900 leading-tight">اتجاه البحري</div>
              <div className="text-[10.5px] text-slate-500 mt-0.5 leading-tight">
                {northBearing !== null ? <span>زاوية الميل: <strong>{northBearing}°</strong></span> : 'خط أصفر على الضلع الشمالي'}
              </div>
            </div>
            <span
              className={`relative rounded-full transition shrink-0 ${showNorthEdges ? "bg-slate-900" : "bg-slate-300"}`}
              style={{ height: "20px", width: "36px" }}

              <span

                style={{ right: showNorthEdges ? "2px" : "18px" }}
              ></span>
            </span>
          </button>

          {/* ── آلة الحاسبة ── */}
          <button
            onClick={() => {
              if (!calcOpen) setCalcUnit("meter"); // default متر، تقدر تغيره من جوه الحاسبة
              setCalcOpen(v => !v);
            }}
            className={`w-full rounded-xl border px-3 py-2.5 flex items-center gap-2.5 transition text-right ${
              calcOpen
                ? "bg-[var(--accent)] border-[var(--accent)] hover:opacity-90"
                : "border-slate-200 bg-white hover:bg-slate-50"
            }`}
          >
            <span className={`grid place-items-center w-8 h-8 rounded-lg shrink-0 ${calcOpen ? "bg-white/20 text-white" : "bg-slate-50 text-slate-700"}`}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2"/>
                <line x1="8" y1="6" x2="16" y2="6"/>
                <line x1="8" y1="14" x2="8" y2="14"/>
                <line x1="12" y1="14" x2="12" y2="14"/>
                <line x1="16" y1="14" x2="16" y2="14"/>
                <line x1="8" y1="18" x2="8" y2="18"/>
                <line x1="12" y1="18" x2="12" y2="18"/>
                <line x1="16" y1="18" x2="16" y2="18"/>
              </svg>
            </span>
            <div className="min-w-0 flex-1">
              <div className={`text-[12.5px] font-semibold leading-tight ${calcOpen ? "text-white" : "text-slate-900"}`}>آلة الحاسبة</div>
              <div className={`text-[10.5px] mt-0.5 leading-tight ${calcOpen ? "text-white/70" : "text-slate-500"}`}>
                {calcUnit === "feddan" ? "وحدة: فدان" : calcUnit === "meter" ? "وحدة: متر مربع" : "حساب المساحات"}
              </div>

            {calcOpen && (

        {/* ── Shapefile settings ── */}
        <section className="space-y-2">
          {/* Header toggle */}

            onClick={() => setShpSettingsOpen(v => !v)}

          >
            <span className="grid place-items-center w-8 h-8 rounded-lg bg-slate-50 text-slate-700 shrink-0">
              <Icon name="settings" size={16} />
            </span>
            <div className="min-w-0 flex-1 text-right">
              <div className="text-[12.5px] font-semibold text-slate-900 leading-tight">إعدادات Shapefile</div>
              <div className="text-[10.5px] text-slate-500 mt-0.5 leading-tight">لون، شفافية</div>

          </button>

          {shpSettingsOpen && (
            <div className="rounded-xl border border-slate-200 bg-white p-3.5 space-y-4">

              {/* ── Fill settings ── */}
              <div className="space-y-2.5">
                <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Fill · التعبئة</div>

/* ══════════════════════════════════════════════════════════════════════════
   آلة الحاسبة — CalculatorModal
   ══════════════════════════════════════════════════════════════════════════ */
function CalculatorModal({ open, onClose, onUnitChange, unit, pendingValue, onPendingConsumed }) {
  // ── Dragging: نستخدم ref للـ position وننقل الـ DOM مباشرة بدون re-render ──
  const wrapRef   = React.useRef(null);
  const posRef    = React.useRef({ x: null, y: null });
  const dragState = React.useRef(null); // { startMouseX, startMouseY, startElX, startElY }

  // ── Calculator state ──
  const [display, setDisplay] = React.useState("0");
  const [expr,    setExpr]    = React.useState("");
  const [waitOp,  setWaitOp]  = React.useState(false);
  const [justEq,  setJustEq]  = React.useState(false);

  // ── ضع الـ panel في المنتصف أول ما تفتح ──
  React.useEffect(() => {
    if (!open) return;
    if (posRef.current.x !== null) return; // لو عنده position محفوظ خلّيه
    const x = Math.max(20, window.innerWidth  / 2 - 155);
    const y = Math.max(20, window.innerHeight / 2 - 250);
    posRef.current = { x, y };
    if (wrapRef.current) {
      wrapRef.current.style.left = x + "px";
      wrapRef.current.style.top  = y + "px";
    }
  }, [open]);

  // ── Drag handlers (mouse + touch) — بيشتغلوا على DOM مباشرة بدون setState ──
  const onDragStart = React.useCallback((clientX, clientY) => {
    if (!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    dragState.current = {
      startMouseX: clientX, startMouseY: clientY,
      startElX: rect.left,  startElY:  rect.top,
    };

    const onMove = (e) => {
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = cx - dragState.current.startMouseX;
      const dy = cy - dragState.current.startMouseY;
      const nx = dragState.current.startElX + dx;
      const ny = dragState.current.startElY + dy;
      posRef.current = { x: nx, y: ny };
      if (wrapRef.current) {
        wrapRef.current.style.left = nx + "px";
        wrapRef.current.style.top  = ny + "px";
        wrapRef.current.style.transform = "none";
      }
    };

    const onUp = () => {
      dragState.current = null;
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup",   onUp);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend",  onUp);
      if (wrapRef.current) wrapRef.current.style.cursor = "";
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup",   onUp);
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend",  onUp);
    if (wrapRef.current) wrapRef.current.style.cursor = "grabbing";
  }, []);

  // ── قيمة من الخريطة ──
  React.useEffect(() => {
    if (pendingValue == null) return;
    // نحوّل القيمة (م² خام) للوحدة المختارة مع truncate بدون تقريب
    const truncate = (n, d) => Math.trunc(n * Math.pow(10, d)) / Math.pow(10, d);
    const converted = unit === "feddan"
      ? truncate(Number(pendingValue) / 4200.83, 4)
      : truncate(Number(pendingValue), 2);
    const val = String(converted) || "0";

    // دايماً نكتب الرقم الجديد بعد آخر عملية أو نستبدل الحالي
    setDisplay(val);
    setExpr(prev => {
      const trimmed = prev.trimEnd();
      if (/[+\-×÷−]$/.test(trimmed)) return trimmed + " " + val;
      const m = trimmed.match(/^(.*[+\-×÷−]\s*)[\d.]+$/s);
      if (m) return m[1] + val;
      return val;
    });
    setWaitOp(false);
    setJustEq(false);
    onPendingConsumed?.();
  }, [pendingValue]);

  // ── Keyboard ──
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      const k = e.key;
      if (k >= "0" && k <= "9")              { e.preventDefault(); handleNum(k); }
      else if (k === ".")                    { e.preventDefault(); handleDot(); }
      else if (k === "+" || k === "-")       { e.preventDefault(); handleOp(k === "+" ? "+" : "−"); }
      else if (k === "*")                    { e.preventDefault(); handleOp("×"); }
      else if (k === "/")                    { e.preventDefault(); handleOp("÷"); }
      else if (k === "Enter" || k === "=")   { e.preventDefault(); handleEquals(); }
      else if (k === "Backspace")            { e.preventDefault(); handleBack(); }
      else if (k === "Escape" || k === "c" || k === "C") { e.preventDefault(); handleClear(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, display, expr, waitOp, justEq]);

  const M2_PER_FEDDAN = 4200.83;

  const safeEval = (expression) => {
    try {
      const clean = expression.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
      // eslint-disable-next-line no-new-func
      const r = Function('"use strict";return(' + clean + ')')();
      return isFinite(r) ? r : null;
    } catch { return null; }
  };

  const handleNum = (n) => {
    if (justEq) {
      setDisplay(n); setExpr(n); setJustEq(false); setWaitOp(false); return;
    }
    if (waitOp) {
      setDisplay(n);
      setExpr(prev => prev + " " + n);
      setWaitOp(false); return;
    }
    const nd = display === "0" ? n : display + n;
    setDisplay(nd);
    setExpr(prev => {
      const m = prev.trimEnd().match(/^(.*[+\-×÷−]\s*)[\d.]+$/s);
      return m ? m[1] + nd : nd;
    });
  };

  const handleDot = () => {
    if (display.includes(".")) return;
    if (waitOp || justEq) {
      setDisplay("0."); setExpr(prev => justEq ? "0." : prev + " 0.");
      setWaitOp(false); setJustEq(false); return;
    }
    const nd = display + ".";
    setDisplay(nd);
    setExpr(prev => {
      const m = prev.trimEnd().match(/^(.*[+\-×÷−]\s*)[\d.]+$/s);
      return m ? m[1] + nd : nd;
    });
  };

  const handleOp = (op) => {
    setJustEq(false); setWaitOp(true);
    setExpr(prev => (prev.trim() || display) + " " + op);
  };

  const handleEquals = () => {
    const r = safeEval(expr.trim() || display);
    if (r === null) { setDisplay("خطأ"); setExpr(""); setWaitOp(false); setJustEq(false); return; }
    const rs = Number.isInteger(r) ? String(r) : parseFloat(r.toFixed(8)).toString();
    setDisplay(rs); setExpr(rs); setWaitOp(false); setJustEq(true);
  };

  const handleClear = () => { setDisplay("0"); setExpr(""); setWaitOp(false); setJustEq(false); };

  const handleBack = () => {
    if (justEq || waitOp) { handleClear(); return; }
    if (display.length <= 1 || display === "خطأ") {
      setDisplay("0");
      setExpr(prev => { const m = prev.trimEnd().match(/^(.*[+\-×÷−]\s*)[\d.]+$/s); return m ? m[1].trimEnd() : ""; });
      return;
    }
    const nd = display.slice(0,-1) || "0";
    setDisplay(nd);
    setExpr(prev => { const m = prev.trimEnd().match(/^(.*[+\-×÷−]\s*)[\d.]+$/s); return m ? m[1] + nd : nd; });
  };

  const counterDisplay = () => "—";

  if (!open) return null;

  // ── أول render: لو posRef فاضي نستخدم transform ──
  const initStyle = posRef.current.x !== null
    ? { left: posRef.current.x + "px", top: posRef.current.y + "px" }
    : { left: "50%", top: "50%", transform: "translate(-50%,-50%)" };

  const btnBase = "flex items-center justify-center rounded-xl text-[18px] font-semibold h-12 select-none transition-all duration-100 active:scale-95 cursor-pointer";
  const numBtn  = "bg-[var(--panel)] hover:bg-[var(--panel-2)] border border-[var(--line)] text-[var(--ink)]";
  const opBtn   = "bg-[var(--accent-soft)] hover:opacity-80 border border-[var(--line)] text-[var(--accent-ink)]";
  const eqBtn   = "bg-[var(--accent)] hover:opacity-90 text-white border border-[var(--accent)]";
  const clrBtn  = "bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-500";
  const backBtn = "bg-[var(--panel-2)] hover:bg-[var(--line)] border border-[var(--line)] text-[var(--ink-soft)]";

  return (
    <div ref={wrapRef} style={{ position:"fixed", zIndex:2000, minWidth:"310px", userSelect:"none", ...initStyle }}>
      <div className="bg-[var(--panel)] border border-[var(--line)] rounded-2xl shadow-2xl overflow-hidden">

        {/* ── Header (draggable) ── */}
        <div
          className="flex items-center gap-2 px-3 py-2.5 border-b border-[var(--line)] select-none bg-[var(--panel-2)]"
          style={{ cursor: "grab" }}
          onMouseDown={(e) => { if (e.button !== 0) return; e.preventDefault(); onDragStart(e.clientX, e.clientY); }}
          onTouchStart={(e) => { e.preventDefault(); onDragStart(e.touches[0].clientX, e.touches[0].clientY); }}
        >
          {/* أيقونة السحب */}
          <span className="grid place-items-center w-7 h-7 rounded-lg bg-[var(--accent-soft)] text-[var(--accent-ink)] shrink-0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="9" cy="5" r="1" fill="currentColor"/><circle cx="15" cy="5" r="1" fill="currentColor"/>
              <circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/>
              <circle cx="9" cy="19" r="1" fill="currentColor"/><circle cx="15" cy="19" r="1" fill="currentColor"/>
            </svg>
          </span>
          <span className="flex-1 text-[13px] font-bold text-[var(--ink)]">آلة الحاسبة</span>

          {/* وحدة القياس */}
          <div className="flex items-center gap-0.5 bg-[var(--panel)] border border-[var(--line)] rounded-lg p-0.5" onMouseDown={e => e.stopPropagation()}>
            <button onClick={() => onUnitChange("meter")}
              className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition ${unit === "meter" ? "bg-[var(--accent)] text-white" : "text-[var(--ink-soft)] hover:text-[var(--ink)]"}`}>م²</button>
            <button onClick={() => onUnitChange("feddan")}
              className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition ${unit === "feddan" ? "bg-[var(--accent)] text-white" : "text-[var(--ink-soft)] hover:text-[var(--ink)]"}`}>فدان</button>
          </div>

          {/* زر الإغلاق */}
          <button onMouseDown={e => e.stopPropagation()} onClick={onClose}
            className="w-7 h-7 grid place-items-center rounded-lg hover:bg-[var(--line)] text-[var(--ink-soft)] transition">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
              <line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/>
            </svg>
          </button>
        </div>

        {/* ── Display ── */}
        <div className="px-3 pt-3 pb-2 space-y-0.5">
          <div className="text-right font-mono text-[11px] text-[var(--ink-soft)] h-4 overflow-hidden truncate leading-4" dir="ltr">
            {expr || "\u00a0"}
          </div>
          <div
            className="text-right font-mono font-bold text-[var(--ink)] leading-tight overflow-hidden cursor-pointer select-all relative group"
            dir="ltr"
            style={{ fontSize: display.length > 12 ? "17px" : display.length > 8 ? "22px" : "28px" }}
            onClick={() => {
              try {
                navigator.clipboard.writeText(display);
              } catch {}
            }}
            onContextMenu={(e) => {
              e.preventDefault();
              try {
                navigator.clipboard.readText().then(txt => {
                  const v = parseFloat(txt.replace(/,/g, ".").trim());
                  if (isFinite(v)) {
                    setDisplay(String(v));
                    setExpr(String(v));
                    setWaitOp(false);
                    setJustEq(true);
                  }
                }).catch(() => {});
              } catch {}
            }}
            title="اضغط للنسخ · كليك يمين للصق"
          >
            {display}
            <span className="absolute left-0 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition text-[9px] text-[var(--ink-soft)] font-normal pr-1">نسخ</span>
          </div>
          <div className="text-right text-[10.5px] text-[var(--ink-soft)] pt-0.5">
            <span className="opacity-50">≈ </span>
            <span className="font-mono">{counterDisplay()}</span>
          </div>
          {/* شريط التلميح */}
          <div className={`flex items-center gap-1.5 rounded-lg px-2 py-1 mt-1 ${unit === "feddan" ? "bg-amber-500/10 border border-amber-500/20" : "bg-blue-500/10 border border-blue-500/20"}`}>
            <svg width="9" height="9" viewBox="0 0 16 16" fill={unit === "feddan" ? "#f59e0b" : "#3b82f6"} className="shrink-0">
              <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm1 8H7V7h2v5z"/>
            </svg>
            <span className={`text-[9.5px] font-medium ${unit === "feddan" ? "text-amber-600" : "text-blue-600"}`}>
              اضغط على أي مضلع في الخريطة لسحب مساحته {unit === "feddan" ? "بالفدان" : "بالمتر المربع"} هنا تلقائياً
            </span>
          </div>
        </div>

        {/* ── Buttons ── */}
        <div className="px-3 pb-3 grid grid-cols-4 gap-2">
          <button onClick={handleClear}          className={`${btnBase} ${clrBtn} col-span-2 text-[14px]`}>مسح</button>
          <button onClick={handleBack}           className={`${btnBase} ${backBtn}`}>⌫</button>
          <button onClick={() => handleOp("÷")}  className={`${btnBase} ${opBtn}`}>÷</button>

          <button onClick={() => handleNum("7")} className={`${btnBase} ${numBtn}`}>7</button>
          <button onClick={() => handleNum("8")} className={`${btnBase} ${numBtn}`}>8</button>
          <button onClick={() => handleNum("9")} className={`${btnBase} ${numBtn}`}>9</button>
          <button onClick={() => handleOp("×")}  className={`${btnBase} ${opBtn}`}>×</button>

          <button onClick={() => handleNum("4")} className={`${btnBase} ${numBtn}`}>4</button>
          <button onClick={() => handleNum("5")} className={`${btnBase} ${numBtn}`}>5</button>
          <button onClick={() => handleNum("6")} className={`${btnBase} ${numBtn}`}>6</button>
          <button onClick={() => handleOp("−")}  className={`${btnBase} ${opBtn}`}>−</button>

          <button onClick={() => handleNum("1")} className={`${btnBase} ${numBtn}`}>1</button>
          <button onClick={() => handleNum("2")} className={`${btnBase} ${numBtn}`}>2</button>
          <button onClick={() => handleNum("3")} className={`${btnBase} ${numBtn}`}>3</button>
          <button onClick={() => handleOp("+")}  className={`${btnBase} ${opBtn}`}>+</button>

          <button onClick={() => handleNum("0")} className={`${btnBase} ${numBtn} col-span-2`}>0</button>
          <button onClick={handleDot}            className={`${btnBase} ${numBtn}`}>.</button>
          <button onClick={handleEquals}         className={`${btnBase} ${eqBtn}`}>=</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);



</script>
</body>
</html>
