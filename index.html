    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif;
      font-feature-settings: 'ss01' on, 'cv11' on;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }
    * { box-sizing: border-box; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* ── Tailwind variable-based theme overrides ─────────────────────── */
    .bg-white       { background-color: var(--tw-bg-white)   !important; }
    .bg-slate-50    { background-color: var(--tw-bg-slate50)  !important; }
    .bg-slate-100   { background-color: var(--tw-bg-slate100) !important; }
    .bg-slate-200   { background-color: var(--tw-bg-slate200) !important; }
    .bg-slate-900   { background-color: var(--tw-bg-slate900) !important; }
    .bg-slate-300   { background-color: var(--tw-bg-slate300) !important; }
    .bg-slate-800   { background-color: var(--tw-bg-slate800) !important; }

    .text-slate-900 { color: var(--tw-text-slate900) !important; }
    .text-slate-800 { color: var(--tw-text-slate800) !important; }
    .text-slate-700 { color: var(--tw-text-slate700) !important; }
    .text-slate-600 { color: var(--tw-text-slate600) !important; }
    .text-slate-500 { color: var(--tw-text-slate500) !important; }

    .text-slate-300 { color: var(--tw-text-slate300) !important; }
    .text-white     { color: var(--tw-text-white)    !important; }

    .border-slate-200 { border-color: var(--tw-border-slate200) !important; }
    .border-slate-100 { border-color: var(--tw-border-slate100) !important; }
    .border-slate-300 { border-color: var(--tw-border-slate300) !important; }

    .hover\:bg-slate-50:hover  { background-color: var(--tw-bg-slate50)  !important; }
    .hover\:bg-slate-100:hover { background-color: var(--tw-bg-slate100) !important; }
    .hover\:bg-slate-200:hover { background-color: var(--tw-bg-slate200) !important; }
    .hover\:bg-slate-800:hover { background-color: var(--tw-bg-slate800) !important; }
    .hover\:border-slate-300:hover { border-color: var(--tw-border-slate300) !important; }
    .hover\:border-slate-400:hover { border-color: var(--tw-text-slate400) !important; }
    .focus\:bg-white:focus { background-color: var(--tw-bg-white) !important; }

    .bg-slate-50\/30 { background-color: color-mix(in srgb, var(--tw-bg-slate50) 30%, transparent) !important; }
    .bg-slate-50\/40 { background-color: color-mix(in srgb, var(--tw-bg-slate50) 40%, transparent) !important; }
    .bg-slate-50\/50 { background-color: color-mix(in srgb, var(--tw-bg-slate50) 50%, transparent) !important; }
    .bg-slate-50\/60 { background-color: color-mix(in srgb, var(--tw-bg-slate50) 60%, transparent) !important; }

    /* ── Inputs ── */
    input[type="text"], input[type="number"], input[type="color"],
    select, textarea {
      background-color: var(--panel-2) !important;
      color: var(--ink) !important;
      border-color: var(--line) !important;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    input[type="text"]::placeholder { color: var(--muted) !important; }

    .leaflet-container { background: var(--leaflet-bg); font-family: inherit; transition: background 0.25s; }

      border: none !important;
      border-radius: 12px !important;
      overflow: hidden;
      box-shadow: var(--shadow-lg) !important;

    .leaflet-control-zoom a {
      background: var(--leaflet-ctrl-bg) !important;
      color: var(--ink) !important;

      width: 34px !important; height: 34px !important;
      line-height: 34px !important;
      font-size: 18px !important;
      transition: background 0.2s;

      border-radius: 6px;

      background: var(--leaflet-popup-bg) !important;

      box-shadow: var(--leaflet-popup-shadow) !important;
    }
    .leaflet-popup-tip { background: var(--leaflet-popup-bg) !important; }
    .leaflet-popup-content {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      direction: rtl;
      text-align: right;
      margin: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink);
    }

    .point-label {
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .point-label div {
      background: var(--point-label-bg);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      transform: translateY(-22px);
      box-shadow: 0 2px 8px -2px rgba(0,0,0,0.4);
    }

    .scroll-thin::-webkit-scrollbar-track  { background: transparent; }

        kind: "PROJECTED", system: "UTM",
        zone, hemi, datum, epsg,
        short: `UTM Zone ${zone}${hemi}`,
        long: `${datum ? datum + " / " : ""}UTM Zone ${zone}${hemi}${epsg ? " · EPSG:" + epsg : ""}`,

    return { kind: "PROJECTED", system: "OTHER", short: pretty.slice(0, 28), long: pretty };

    const pretty = name.replace(/_/g, " ");

      case "MultiLineString": geom.coordinates.forEach(c => out.push({ type: "line", coords: c, layerName })); break;

/* ──────────────────────────────────────────────────────────────────────────

/* ──────────────────────────────────────────────────────────────────────────

const FEDDAN_M2 = 4200.83;

/** Truncate (do not round) to N decimals; returns a string. */

function ringAreaUtm(ring, zone, hemi) {
  let s = 0;
  const pts = ring.map(c => toUtm(c, zone, hemi));
  for (let i = 0, n = pts.length; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];

function ringAreaSpherical(ring) {

/** Perpendicular distance from a [lon,lat] point to a [lon,lat] line segment,

function distPointToSegmentMeters(p, a, b, zone, hemi) {

  const [ax, ay] = toUtm(a, zone, hemi);

  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);

    if (!poly.zone) continue;

// ── Helper functions (AutoCAD-style bearing) ──

  const dy = p2[1] - p1[1];

/** حساب اتجاه البحري لضلع معطى [p1, p2]

  const az2 = normalize360(az1 + 180);            // B → A

  const diff2 = angleDifferenceToNorth(az2);

    fromPoint:    northward ? p1 : p2,
    toPoint:      northward ? p2 : p1,
    azimuth:      northward ? az1 : az2,
    angleFromNorth: Math.min(diff1, diff2),
    directionLabel: northward ? 'A_TO_B' : 'B_TO_A',
    oppositeDirectionInfo: {
      azimuth:        northward ? az2 : az1,

 *  بناءً على أطول ضلع — نفس منطق AutoCAD
 *  ring: [[x,y], ...] — projected coords (UTM) أو lon/lat */
function calcPolygonBearing(ring) {
  if (!ring || ring.length < 3) return null;

  // تنظيف النقاط المكررة
  const pts = ring.filter((p, i, a) =>
    i === 0 || p[0] !== a[i-1][0] || p[1] !== a[i-1][1]
  );
  // تجاهل الضلع الأخير لو مكرر لأول نقطة
  const n = (pts.length > 2 &&
    pts[0][0] === pts[pts.length-1][0] &&
    pts[0][1] === pts[pts.length-1][1])
    ? pts.length - 1 : pts.length;

  if (n < 2) return null;

  let bestIdx = 0, bestLen = -1;

    const p1 = pts[i], p2 = pts[(i+1) % n];
    const len = edgeDist(p1, p2);
    if (len > bestLen) { bestLen = len; bestIdx = i; }
  }

  const p1 = pts[bestIdx], p2 = pts[(bestIdx+1) % n];
  const dx = p2[0] - p1[0];
  const dy = p2[1] - p1[1];

  const cadAngle = normalize360(Math.atan2(dy, dx) * 180 / Math.PI);

  const azimuthBearing = normalize360(Math.atan2(dx, dy) * 180 / Math.PI);

  const signedTiltFromNorth = normalize180(90 - cadAngle);

  return {
    startPoint: p1, endPoint: p2, length: bestLen,
    cadAngle, azimuthFromNorth: azimuthBearing, signedTiltFromNorth,
    rotationToMakeEdgeNorth: signedTiltFromNorth,

/** الحد البحري = الضلع اللي وجهه (عموده الخارجي) بيشير للشمال أكثر

  if (!ring || ring.length < 4) return -1;

  let cx = 0, cy = 0;
  const n = ring.length - 1;
  for (let i = 0; i < n; i++) { cx += ring[i][0]; cy += ring[i][1]; }

  let bestIdx = -1, bestNy = -Infinity;
  for (let i = 0; i < ring.length - 1; i++) {
    const [x1,y1] = ring[i], [x2,y2] = ring[i+1];
    const dx = x2-x1, dy = y2-y1;
    const len = Math.hypot(dx,dy);
    if (len < 1e-10) continue;

    // العمودي الأيسر والأيمن
    const nx1=-dy/len, ny1= dx/len;
    const nx2= dy/len, ny2=-dx/len;

    const mx=(x1+x2)/2, my=(y1+y2)/2;

    const dot1=(mx+nx1-cx)*nx1+(my+ny1-cy)*ny1;
    const dot2=(mx+nx2-cx)*nx2+(my+ny2-cy)*ny2;

    // الضلع الأشمل = أكبر مكون Y للعمودي الخارجي

/** HTML for a feature popup — Polygon → area (m² + feddan), Line → length, Point → coords. */
function featureMetricsHtml(feature, zone, hemi) {

  const row = (label, val, unit, accent) => `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:6px 0;${accent ? "border-top:1px solid #30363d" : ""}">
      <span style="color:#8b949e;font-size:11.5px">${label}</span>

        ${val} <span style="color:#484f58;font-weight:500;font-size:11px">${unit}</span>
      </span>

    g.type === "MultiPolygon" ? g.coordinates :

    let s = 0;

    for (let i = 0; i < r.length - 1; i++) {

    const xi = Number(ring[i][0]);
    const yi = Number(ring[i][1]);
    const xj = Number(ring[j][0]);
    const yj = Number(ring[j][1]);

    const intersect =
      ((yi > lat) !== (yj > lat)) &&
      (lng < ((xj - xi) * (lat - yi)) / ((yj - yi) || 1e-12) + xi);

    return pointInPolygonCoords(lng, lat, geometry.coordinates);

    return geometry.coordinates.some(rings =>

  return false;

        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        checked++;

        if (isLikelyUtmEasting(x) && isLikelyUtmNorthing(y)) {
          score += 3;

          // شماليات مصر غالبًا في حدود 2 مليون إلى 4 مليون
          if (y > 1500000 && y < 4500000) score += 2;
        }
      }

      if (checked >= 2 && (!best || score > best.score)) {
        best = { xCol, yCol, score, type: "utm" };
      }
    }
  }

  // fallback لو الملف Lat/Lon بدون headers
  if (!best || best.score < 6) {
    for (let lonCol = 0; lonCol < maxCols; lonCol++) {
      for (let latCol = 0; latCol < maxCols; latCol++) {
        if (lonCol === latCol) continue;

        let score = 0;
        let checked = 0;

        for (const row of rows.slice(0, 40)) {
          const lon = sheetNum(row[lonCol]);
          const lat = sheetNum(row[latCol]);

          if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
          checked++;

          if (isLikelyLon(lon) && isLikelyLat(lat)) score += 2;
        }

        if (checked >= 2 && (!best || score > best.score)) {
          best = { xCol: lonCol, yCol: latCol, score, type: "ll" };
        }
      }
    }
  }

  if (!best || best.score < 4) return null;

  const headers = Array.from({ length: maxCols }, (_, i) => `__COL_${excelColName(i)}`);

  const dataRows = rows.map(r => {
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = r[i] !== undefined ? r[i] : "";
    });
    return obj;
  });

  // اختيارات ذكية من الصورة:
  // A = ID غالبًا
  // B = Code/Type غالبًا
  // بعد Y مباشرة ممكن Z/Elevation
  const idCol = headers[0] || null;
  const codeCol = headers[1] || null;

  let elevCol = null;
  const afterY = best.yCol + 1;
  if (afterY < headers.length) {
    const hasNumericElev = rows.some(r => Number.isFinite(sheetNum(r[afterY])));
    if (hasNumericElev) elevCol = headers[afterY];
  }

  if (best.type === "utm") {
    return {
      headers,
      dataRows,
      coordOverride: {
        eastingCol: headers[best.xCol],
        northingCol: headers[best.yCol],
        latCol: null,
        lonCol: null,
        idCol,
        codeCol,
        labelCol: idCol,
        descCol: null,
        elevCol,
      },
    };
  }

  return {
    headers,
    dataRows,
    coordOverride: {
      lonCol: headers[best.xCol],
      latCol: headers[best.yCol],
      eastingCol: null,
      northingCol: null,
      idCol,
      codeCol,
      labelCol: idCol,
      descCol: null,
      elevCol,
    },
  };
}

function buildSheetLayer(arrayBuffer, fileName, color) {
  let wb;
  try {
    wb = XLSX.read(arrayBuffer, { type: "array" });
  } catch {
    return null;
  }

  const ws = wb.Sheets[wb.SheetNames[0]];

  const aoa = XLSX.utils.sheet_to_json(ws, {
    header: 1,
    defval: "",
    raw: true,
  });

  if (!aoa.length) return null;

  let headerRowIdx = -1;

  // 1) محاولة القراءة العادية من Headers
  for (let i = 0; i < aoa.length; i++) {
    const cells = aoa[i].map(c => String(c).trim().toLowerCase());

    const hasEN =
      cells.some(c => c.includes("easting") || c === "x" || c === "e" || c.includes("شرق")) &&
      cells.some(c => c.includes("northing") || c === "y" || c === "n" || c.includes("شمال"));

    const hasLL =
      cells.some(c => c === "lat" || c.includes("latitude") || c.includes("خط العرض")) &&
      cells.some(c => c === "lon" || c === "lng" || c.includes("longitude") || c.includes("خط الطول"));

    if (hasEN || hasLL) {
      headerRowIdx = i;
      break;
    }
  }

  let headers;
  let dataRows;
  let coordOverride = null;

  // 2) لو مفيش Headers — نقرأ الملف تلقائيًا من القيم
  if (headerRowIdx < 0) {
    const auto = detectHeaderlessSheetLayout(aoa);
    if (!auto) return null;

    headers = auto.headers;
    dataRows = auto.dataRows;
    coordOverride = auto.coordOverride;
  } else {
    headers = aoa[headerRowIdx].map(c => String(c).trim());

    dataRows = aoa.slice(headerRowIdx + 1)
      .filter(r => r.some(c => c !== "" && c !== null && c !== undefined))
      .map(r => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = r[i] !== undefined ? r[i] : "";
        });
        return obj;
      });
  }

  if (!dataRows.length) return null;

  let detected = detectCoordColumns(headers);

  if (coordOverride) {
    detected = {
      ...detected,
      ...coordOverride,
    };
  }

  const {
    latCol,
    lonCol,
    eastingCol,
    northingCol,
    idCol,
    codeCol,
    labelCol,
    descCol,
    elevCol,
  } = detected;

  let utmZ = null;
  let utmH = "N";

  const projected = !!(eastingCol && northingCol);

  if (projected) {
    // حاول تجيب Zone من أي metadata فوق الجدول
    const metaRows = headerRowIdx >= 0 ? aoa.slice(0, headerRowIdx) : aoa.slice(0, 5);

    for (const row of metaRows) {
      for (const cell of row) {
        const z = extractUtmZoneFromText(cell);
        if (z) {
          utmZ = z.zone;
          utmH = z.hemi;
          break;
        }
      }
      if (utmZ) break;
    }

    // مصر غالبًا Zone 36N لو مفيش معلومات
    if (!utmZ) {
      utmZ = 36;
      utmH = "N";
    }

    registerUtm(utmZ, utmH);
  } else if (!latCol || !lonCol) {
    return null;
  }

  const group = L.featureGroup();
  const points = [];
  let count = 0;

  for (const r of dataRows) {
    let lat;
    let lon;

    if (projected) {
      const E = sheetNum(r[eastingCol]);
      const N = sheetNum(r[northingCol]);

      if (!Number.isFinite(E) || !Number.isFinite(N)) continue;

      const [pLon, pLat] = proj4(
        `EPSG:${utmEpsg(utmZ, utmH)}`,
        "EPSG:4326",
        [E, N]
      );

      lon = pLon;
      lat = pLat;
    } else {
      lat = sheetNum(r[latCol]);
      lon = sheetNum(r[lonCol]);

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    }

    const labelBits = [];

    if (labelCol && r[labelCol] !== "") {
      labelBits.push(String(r[labelCol]));
    } else if (idCol && r[idCol] !== "") {
      labelBits.push(String(r[idCol]));
    }

    if (codeCol && r[codeCol] !== "") {
      labelBits.push(String(r[codeCol]));
    }

    const label = labelBits.join(" · ");
    const desc = descCol ? String(r[descCol] || "") : "";
    const elev = elevCol ? String(r[elevCol] || "") : "";

const m = L.circleMarker([lat, lon], {
  pane: "sheetPointsPane",
  radius: 6,
  color: "#fff",
  weight: 1.6,
  fillColor: color,
  fillOpacity: 0.95,
});


    const popup = `
      <div style="min-width:180px">
        ${label ? `<div style="font-weight:600;margin-bottom:4px;color:#e6edf3">${label}</div>` : ""}
        <div class="font-mono" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8b949e">
          ${
            projected
              ? `X/E ${sheetNum(r[eastingCol]).toFixed(3)} · Y/N ${sheetNum(r[northingCol]).toFixed(3)}<br/>UTM ${utmZ}${utmH}`
              : `${lat.toFixed(6)}, ${lon.toFixed(6)}`
          }
          ${elev ? `<br/>Z ${elev}` : ""}
        </div>
        ${desc ? `<div style="margin-top:6px;color:#b0bac4">${desc}</div>` : ""}
      </div>
    `;

    m.bindPopup(popup);

    m._sheetMeta = {
      label,
      desc,
      projected,
      lat,
      lon,
      E: projected ? sheetNum(r[eastingCol]) : null,
      N: projected ? sheetNum(r[northingCol]) : null,
      utmZ,
      utmH,
      baseColor: color,
    };

    m.addTo(group);
    points.push([lon, lat]);
    count++;
  }

  if (count === 0) return null;

  let zone = projected ? utmZ : null;
  let hemi = projected ? utmH : "N";

  if (!zone && points.length) {
    const mx = points.reduce((s, p) => s + p[0], 0) / points.length;
    const my = points.reduce((s, p) => s + p[1], 0) / points.length;
    zone = utmZoneFromLon(mx);
    hemi = my >= 0 ? "N" : "S";
  }

  return {
    id: uid(),
    name: fileName,
    kind: "sheet",
    geomType: "Point",
    color,
    visible: true,
    count,
    leafletLayer: group,
    points,
    zone,
    hemi,
    crs: projected
      ? {
          kind: "PROJECTED",
          system: "UTM",
          zone,
          hemi,
          short: `UTM Zone ${zone}${hemi}`,
          long: `WGS 84 / UTM Zone ${zone}${hemi} · EPSG:${utmEpsg(zone, hemi)}`,
        }
      : { ...CRS_DEFAULT_WGS84 },
  };
}

/** Walk a JSZip and collect by filetype. Returns { prjByBase, sheetEntries, innerZipBuffers }.
 *  Handles nested ZIP and nested RAR (converts RAR→ZIP on the fly). */
async function indexArchive(zip, _depth) {
  _depth = _depth || 0;
  const MAX_DEPTH = 5;
  const prjByBase     = {};
  const sheetEntries  = [];
  const innerZipBuffers = [];

  for (const e of Object.values(zip.files)) {
    if (e.dir) continue;
    const ext  = e.name.match(/\.([^.\/]+)$/i)?.[1]?.toLowerCase();
    const base = e.name.replace(/\.[^.\/]+$/, "").split("/").pop();

    if (ext === "prj") {
      prjByBase[base] = await e.async("string");
    } else if (["xlsx","xls","csv"].includes(ext)) {
      sheetEntries.push(e);
    } else if (ext === "zip" && _depth < MAX_DEPTH) {
      try {
        const innerBuf = await e.async("arraybuffer");
        const innerZip = await JSZip.loadAsync(innerBuf);
        const inner = await indexArchive(innerZip, _depth + 1);
        Object.assign(prjByBase, inner.prjByBase);
        sheetEntries.push(...inner.sheetEntries);
        innerZipBuffers.push({ name: base, buf: innerBuf });
        innerZipBuffers.push(...inner.innerZipBuffers);
      } catch (err) {
        console.warn("Failed to open nested ZIP:", e.name, err);
      }
    } else if (ext === "rar" && _depth < MAX_DEPTH) {
      // ── RAR داخل ZIP — نحوله لـ ZIP ونعاملوه كـ ZIP داخلي ──
      try {
        const rarBuf = await e.async("arraybuffer");
        const convertedBuf = await viaBuiltinRar(rarBuf);
        const innerZip = await JSZip.loadAsync(convertedBuf);
        const inner = await indexArchive(innerZip, _depth + 1);
        Object.assign(prjByBase, inner.prjByBase);
        sheetEntries.push(...inner.sheetEntries);
        innerZipBuffers.push({ name: base, buf: convertedBuf });
        innerZipBuffers.push(...inner.innerZipBuffers);
      } catch (err) {
        console.warn("Failed to open nested RAR:", e.name, err);
      }
    }
  }
  return { prjByBase, sheetEntries, innerZipBuffers };
}

/* ──────────────────────────────────────────────────────────────────────────
   ANY-ARCHIVE SUPPORT — RAR / 7z / tar / gz / bz2 via libarchive.js, with
   ZIP fast-pathed through JSZip. All non-ZIP formats get re-packed into
   an in-memory ZIP so the rest of the pipeline (shpjs + JSZip) stays simple.
   ────────────────────────────────────────────────────────────────────────── */
function detectArchiveKind(buffer) {
  const u = new Uint8Array(buffer.slice ? buffer.slice(0, 16) : buffer.buffer.slice(0, 16));
  // ZIP: PK\x03\x04 / PK\x05\x06 / PK\x07\x08
  if (u[0] === 0x50 && u[1] === 0x4B && (u[2] === 0x03 || u[2] === 0x05 || u[2] === 0x07)) return "zip";
  // RAR: "Rar!"
  if (u[0] === 0x52 && u[1] === 0x61 && u[2] === 0x72 && u[3] === 0x21) return "rar";
  // 7z: 37 7A BC AF 27 1C
  if (u[0] === 0x37 && u[1] === 0x7A && u[2] === 0xBC && u[3] === 0xAF && u[4] === 0x27 && u[5] === 0x1C) return "7z";
  // GZip: 1F 8B
  if (u[0] === 0x1F && u[1] === 0x8B) return "gz";
  // Bzip2: "BZh"
  if (u[0] === 0x42 && u[1] === 0x5A && u[2] === 0x68) return "bz2";
  // tar usually has "ustar" at offset 257 — cheap check
  return "unknown";
}

/** Shim `require` to a no-op stub so CJS bundles that leak `require()` calls
 *  into the browser (libarchive.js, etc.) don't throw before we get a chance
 *  to use them. Safe because nothing in this project calls require() itself. */
function ensureRequireShim() {
  if (typeof globalThis.require === "undefined") {
    globalThis.require = function (id) {
      console.debug("[require-shim] returning {} for", id);
      return {};
    };
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   RAR EXTRACTOR — uses the inline node-unrar-js WASM bundle loaded above.
   Supports RAR4 + RAR5 solid archives, Arabic filenames, nested folders.
   ══════════════════════════════════════════════════════════════════════════ */

/** Extract RAR → flat [{name, data}] via the inline WASM extractor */
async function extractRarWasm(arBuffer) {
  if (typeof window.__unrarCreateExtractorFromData !== "function") {
    throw new Error("unrar WASM bundle not loaded");
  }
  const extractor = await window.__unrarCreateExtractorFromData({ data: arBuffer });

  // ⚠️ Do NOT pass a files filter — passing an array causes early termination
  //    when count reaches files.length (hits all unique names before processing
  //    duplicates from nested folders). Extract everything and deduplicate later.
  const { files } = extractor.extract();

  const result = [];
  for (const file of files) {
    if (!file.fileHeader.flags.directory && file.extraction) {
      result.push({
        name: file.fileHeader.name.replace(/\\/g, "/"),
        data: file.extraction,
      });
    }
  }
  return result;
}

/** Keep original folder structure so shpjs treats same-named layers in
 *  different folders as separate layers. No deduplication whatsoever. */
function flattenFileList(fileList) {
  // Keep paths as-is — shpjs handles subfolders and returns one FC per .shp found
  return fileList.filter(f => f.name);
}

/** Convert a [{name, data}] list to a JSZip ArrayBuffer (files at root). */
async function filesToZipBuffer(fileList) {
  const newZip = new JSZip();
  for (const { name, data } of fileList) newZip.file(name, data);
  return await newZip.generateAsync({ type: "arraybuffer" });
}

/** Main RAR → ZIP converter — يعالج الـ nested RARs داخل RAR بشكل recursive */
async function viaBuiltinRar(arBuffer) {
  const fileList = await extractRarWasm(arBuffer);
  if (fileList.length === 0) throw new Error("RAR archive is empty or extraction failed");
  const flat = flattenFileList(fileList);

  // ── فحص لو في RAR داخل RAR ──
  const nestedRars   = flat.filter(f => /\.rar$/i.test(f.name));
  const regularFiles = flat.filter(f => !/\.rar$/i.test(f.name));

  if (nestedRars.length === 0) {
    // لا يوجد nested RARs — الحالة العادية
    return await filesToZipBuffer(regularFiles);
  }

  // ── يوجد nested RARs — نفكهم ونضيف محتوياتهم للملفات العادية ──
  const allFiles = [...regularFiles];
  for (const nested of nestedRars) {
    try {
      const nestedBuf = (nested.data.buffer)
        ? nested.data.buffer.slice(nested.data.byteOffset, nested.data.byteOffset + nested.data.byteLength)
        : nested.data;
      const nestedZipBuf = await viaBuiltinRar(nestedBuf);
      // نفتح الـ ZIP الناتج ونسحب منه الملفات
      const nestedZip = await JSZip.loadAsync(nestedZipBuf);
      const nestedBase = nested.name.replace(/\.rar$/i, "");
      for (const e of Object.values(nestedZip.files)) {
        if (e.dir) continue;
        const data = await e.async("uint8array");
        allFiles.push({ name: nestedBase + "/" + e.name, data });
      }
    } catch (err) {
      console.warn("Failed to extract nested RAR:", nested.name, err);
    }
  }

  return await filesToZipBuffer(allFiles);
}

/** Unified entrypoint */
async function normalizeToZipBuffer(buf, kind) {
  if (kind === "zip") return buf;
  if (kind === "rar") return await viaBuiltinRar(buf);
  throw new Error(`صيغة ${kind.toUpperCase()} غير مدعومة — استخدم ZIP أو RAR`);
}

/* ──────────────────────────────────────────────────────────────────────────
   GEOMETRY TYPE INSPECTION + KML EXPORT HELPERS
   ────────────────────────────────────────────────────────────────────────── */
const GEOM_TYPES = {
  Point:      { txt: "نقاط",    short: "POINT",   icon: "dot"  },
  LineString: { txt: "خطوط",    short: "LINE",    icon: "line" },
  Polygon:    { txt: "مضلعات",  short: "POLYGON", icon: "poly" },
};

/** Return the dominant base geometry type for a FeatureCollection. */
function detectGeomType(fc) {
  if (!fc || !fc.features || fc.features.length === 0) return null;
  const counts = {};
  for (const f of fc.features) {
    const t = f.geometry && f.geometry.type;
    if (!t) continue;
    const base = t.replace(/^Multi/, "");
    counts[base] = (counts[base] || 0) + 1;
  }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return sorted[0] ? sorted[0][0] : null;
}

/** Convert "#RRGGBB" to KML's AABBGGRR pair (line + filled). */
function hexToKmlColors(hex) {
  const m = String(hex || "#888888").replace("#", "").match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if (!m) return { line: "ff888888", fill: "4d888888" };
  const [, r, g, b] = m;
  return { line: `ff${b}${g}${r}`.toLowerCase(), fill: `66${b}${g}${r}`.toLowerCase() };
}
const xmlEscape = (s) => String(s ?? "").replace(/[<>&"']/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;", "'":"&apos;" }[c]));

/** Build a KML document containing only the supplied polygon folders. */
function buildKML(folders, docName = "دليل المراجع الذكي") {
  const lines = [];
  lines.push('<?xml version="1.0" encoding="UTF-8"?>');
  lines.push('<kml xmlns="http://www.opengis.net/kml/2.2">');
  lines.push("<Document>");
  lines.push(`  <name>${xmlEscape(docName)}</name>`);

  folders.forEach((folder, idx) => {
    const styleId = `s${idx}`;
    const cols = hexToKmlColors(folder.color);
    lines.push(`  <Style id="${styleId}">`);
    lines.push(`    <LineStyle><color>${cols.line}</color><width>2</width></LineStyle>`);
    lines.push(`    <PolyStyle><color>${cols.fill}</color><fill>1</fill><outline>1</outline></PolyStyle>`);
    lines.push("  </Style>");
    lines.push("  <Folder>");
    lines.push(`    <name>${xmlEscape(folder.name)}</name>`);
    folder.polys.forEach(({ rings, props }) => {
      lines.push("    <Placemark>");
      const fName = props && (props.name || props.NAME || props.Name || props.id || props.ID);
      if (fName) lines.push(`      <name>${xmlEscape(fName)}</name>`);
      lines.push(`      <styleUrl>#${styleId}</styleUrl>`);
      const propKeys = props ? Object.keys(props).slice(0, 10) : [];
      if (propKeys.length) {
        lines.push("      <ExtendedData>");
        for (const k of propKeys) {
          lines.push(`        <Data name="${xmlEscape(k)}"><value>${xmlEscape(props[k])}</value></Data>`);
        }
        lines.push("      </ExtendedData>");
      }
      lines.push("      <Polygon>");
      lines.push("        <outerBoundaryIs><LinearRing><coordinates>");
      lines.push("          " + rings[0].map(([x, y]) => `${x},${y},0`).join(" "));
      lines.push("        </coordinates></LinearRing></outerBoundaryIs>");
      for (let i = 1; i < rings.length; i++) {
        lines.push("        <innerBoundaryIs><LinearRing><coordinates>");
        lines.push("          " + rings[i].map(([x, y]) => `${x},${y},0`).join(" "));
        lines.push("        </coordinates></LinearRing></innerBoundaryIs>");
      }
      lines.push("      </Polygon>");
      lines.push("    </Placemark>");
    });
    lines.push("  </Folder>");
  });

  lines.push("</Document>");
  lines.push("</kml>");
  return lines.join("\n");
}

/* ──────────────────────────────────────────────────────────────────────────
   DROP ZONE — drag-and-drop file uploader
   ────────────────────────────────────────────────────────────────────────── */
const DropZone = ({ icon, label, hint, accept, onFile, onFiles, multiple = false }) => {
  const [hover, setHover] = useState(false);

  const sendFiles = (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;

    if (multiple && onFiles) {
      onFiles(files);
    } else if (onFile) {
      onFile(files[0]);
    }
  };

  const handlePick = (e) => {
    sendFiles(e.target.files);
    e.target.value = "";
  };

  return (
    <label
      onDragOver={(e) => {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = "copy";
        if (!hover) setHover(true);
      }}
      onDragEnter={(e) => {
        e.preventDefault();
        e.stopPropagation();
        setHover(true);
      }}
      onDragLeave={(e) => {
        e.preventDefault();
        e.stopPropagation();
        setHover(false);
      }}
      onDrop={(e) => {
        e.preventDefault();
        e.stopPropagation();
        setHover(false);
        sendFiles(e.dataTransfer.files);
      }}
      className={`block cursor-pointer rounded-xl border-2 border-dashed px-3 py-3 transition select-none ${
        hover
          ? "border-[var(--accent)] bg-[var(--accent-soft)]"
          : "border-[var(--line)] bg-[var(--panel-2)] hover:border-[var(--muted)] hover:bg-[var(--panel)]"
      }`}
    >
      <div className="flex items-center gap-3 pointer-events-none">
        <span
          className={`grid place-items-center w-9 h-9 rounded-lg shrink-0 transition ${
            hover
              ? "bg-[var(--panel)] text-[var(--accent-ink)]"
              : "bg-[var(--panel)] text-[var(--ink-soft)] border border-[var(--line)]"
          }`}
        >
          <Icon name={hover ? "download" : icon} size={18} />
        </span>

        <div className="min-w-0 flex-1">
          <div className="text-[13px] font-semibold leading-tight text-[var(--ink)]">
            {hover ? "اترك الملفات هنا" : label}
          </div>

          {hint && (
            <div className="text-[10.5px] text-slate-500 mt-0.5 leading-tight truncate">
              {hint}
            </div>
          )}
        </div>
      </div>

      <input
        type="file"
        accept={accept}
        hidden
        multiple={multiple}
        onChange={handlePick}
      />
    </label>
  );
};

/* ──────────────────────────────────────────────────────────────────────────
   ATTRIBUTE TABLE MODAL — QGIS-style table of feature properties for a
   shapefile layer. Click a row to focus / highlight the feature on the map.
   ────────────────────────────────────────────────────────────────────────── */
const AttributeTableModal = ({ layer, onClose, onZoomFeature, onToggleFeatureVisibility }) => {
  const [query, setQuery] = useState("");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [selectedIdx, setSelectedIdx] = useState(null);

  // Collect features from the layer's geojson FCs, flattened, with stable indices.
  const features = useMemo(() => {
    if (!layer) return [];
    const out = [];
    (layer.geojson || []).forEach(fc => {
      (fc.features || []).forEach(f => out.push(f));
    });
    return out;
  }, [layer]);

  // Build the column list from the union of all feature properties.
  const columns = useMemo(() => {
    const seen = new Map();
    features.forEach(f => {
      const p = f.properties || {};
      Object.keys(p).forEach(k => { if (!seen.has(k)) seen.set(k, true); });
    });
    return Array.from(seen.keys());
  }, [features]);

  // Filter + sort.
  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    const filtered = features
.map((f, i) => {
  const featureId = String(f.__featureId ?? i);
  const hidden = layer?.hiddenFeatureIds?.has(featureId);

  return {
    idx: i,
    featureId,
    hidden,
    props: f.properties || {},
    geom: f.geometry,
  };
})
      .filter(r => {
        if (!q) return true;
        for (const c of columns) {
          if (String(r.props[c] ?? "").toLowerCase().includes(q)) return true;
        }
        return String(r.idx + 1).includes(q);
      });
    if (sortKey) {
      filtered.sort((a, b) => {
        const va = a.props[sortKey], vb = b.props[sortKey];
        const na = parseFloat(va), nb = parseFloat(vb);
        const numeric = isFinite(na) && isFinite(nb);
        const cmp = numeric ? (na - nb) : String(va ?? "").localeCompare(String(vb ?? ""), "ar");
        return sortDir === "asc" ? cmp : -cmp;
      });
    }
    return filtered;
}, [features, columns, query, sortKey, sortDir, layer?.hiddenFeatureIds]);

  const setSort = (col) => {
    if (sortKey === col) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortKey(col); setSortDir("asc"); }
  };

  if (!layer) return null;

  // Compute centroid of a feature so we can pan/zoom to it.
  const featureCentroid = (geom) => {
    if (!geom) return null;
    const c = geoJsonCentroid({ type: "Feature", geometry: geom });
    return c;
  };

  return (
    <div
      className="fixed inset-0 z-[1000] bg-slate-900/50 backdrop-blur-sm grid place-items-center p-4"
      onClick={onClose}
    >
      <div
        className="bg-[var(--panel)] rounded-2xl shadow-2xl w-full max-w-[1100px] max-h-[88vh] flex flex-col overflow-hidden"
        onClick={(e) => e.stopPropagation()}
      >
        {/* Header */}
        <header className="px-4 py-3 border-b border-[var(--line)] flex items-center gap-3">
          <span
            className="w-3 h-3 rounded-full shrink-0 ring-2 ring-white"
            style={{ background: layer.color, boxShadow: "0 0 0 1px " + layer.color + "33" }}
          />
          <div className="min-w-0">
            <div className="text-[14px] font-bold text-slate-900 truncate leading-tight">
              {layer.name}
            </div>
            <div className="text-[11px] text-slate-500 mt-0.5 font-mono">
              {features.length} عنصر · {columns.length} عمود
              {layer.crs?.short ? ` · ${layer.crs.short}` : ""}
            </div>
          </div>

          <div className="flex-1" />

<div
  className="relative"
>
            <Icon name="search" size={14} className="absolute top-1/2 right-2.5 -translate-y-1/2 text-slate-400 pointer-events-none" />
            <input
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="بحث في كل الأعمدة..."
              className="h-9 w-56 rounded-lg border border-[var(--line)] bg-[var(--panel-2)] pr-7 pl-2.5 text-[12.5px] text-[var(--ink)] placeholder:text-[var(--muted)] focus:outline-none focus:border-[var(--accent)] focus:bg-[var(--panel)] transition"
            />
          </div>

          <button
            onClick={onClose}
            className="grid place-items-center w-9 h-9 rounded-md text-slate-500 hover:bg-slate-100"
            aria-label="إغلاق"
          >
            <Icon name="close" size={18} />
          </button>
        </header>

        {/* Table */}
        <div className="flex-1 min-h-0 overflow-auto scroll-thin" dir="ltr">
          {rows.length === 0 ? (
            <div className="h-full grid place-items-center p-8">
              <div className="text-center">
                <Icon name="table" size={32} className="mx-auto text-slate-300 mb-2" />
                <div className="text-[13px] text-slate-500">
                  {features.length === 0 ? "لا توجد عناصر في هذه الطبقة" : "لا توجد نتائج مطابقة"}
                </div>
              </div>
            </div>
          ) : (
            <table className="w-full border-collapse text-[12px]" style={{ direction: "ltr" }}>
              <thead className="sticky top-0 z-10 bg-[var(--panel-2)]">
                <tr>
                  <th className="text-left font-mono text-[10.5px] font-semibold text-slate-500 uppercase tracking-wider px-2 py-2 border-b border-[var(--line)] bg-[var(--panel-2)] sticky left-0 z-20">
                    #
                  </th>
                  <th className="text-center font-mono text-[10.5px] font-semibold text-slate-500 uppercase tracking-wider px-2 py-2 border-b border-[var(--line)] bg-[var(--panel-2)]">
  عرض
</th>
                  {columns.length === 0 ? (
                    <th className="text-left text-[11px] font-semibold text-slate-500 px-3 py-2 border-b border-[var(--line)]">
                      (لا توجد سمات)
                    </th>
                  ) : columns.map(col => (
                    <th
                      key={col}
                      onClick={() => setSort(col)}
                      className="text-left text-[11.5px] font-semibold text-slate-700 px-3 py-2 border-b border-[var(--line)] cursor-pointer hover:bg-slate-100 select-none whitespace-nowrap"
                    >
                      <span className="flex items-center gap-1">
                        {col}
                        {sortKey === col && (
                          <Icon name={sortDir === "asc" ? "chevronUp" : "chevronDown"} size={11} className="text-[var(--accent)]" />
                        )}
                      </span>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => {
                  const isSel = selectedIdx === r.idx;
                  return (
                    <tr
                      key={r.idx}
                      onClick={() => {
                        setSelectedIdx(r.idx);
                        const c = featureCentroid(r.geom);
                        if (c) onZoomFeature(c);
                      }}
className={`cursor-pointer transition ${
  r.hidden
    ? "opacity-50 bg-slate-100"
    : isSel
      ? "bg-[var(--accent-soft)]"
      : i % 2
        ? "bg-white"
        : "bg-slate-50/30"
} hover:bg-[var(--accent-soft)]/70`}
                    >
                      <td className={`font-mono text-[10.5px] text-slate-500 px-2 py-1.5 border-b border-[var(--line-2)] sticky left-0 ${
                        isSel ? "bg-[var(--accent-soft)]" : i % 2 ? "bg-white" : "bg-slate-50/30"
                      }`}>
                        {r.idx + 1}
                      </td>

                      <td className="text-center px-2 py-1.5 border-b border-[var(--line-2)]">
  <button
    type="button"
    onClick={(e) => {
      e.stopPropagation();
      onToggleFeatureVisibility?.(layer.id, r.featureId);
    }}
    className={`grid place-items-center w-7 h-7 rounded-md mx-auto transition ${
      r.hidden
        ? "bg-slate-100 text-slate-400 hover:bg-slate-200"
        : "text-slate-600 hover:bg-[var(--accent-soft)] hover:text-[var(--accent-ink)]"
    }`}
    title={r.hidden ? "إظهار هذا الجزء على الخريطة" : "إخفاء هذا الجزء من الخريطة"}
  >
    <Icon name={r.hidden ? "eyeOff" : "eye"} size={14} />
  </button>
</td>

                      {columns.length === 0 ? (
                        <td className="text-[11px] text-slate-400 italic px-3 py-1.5 border-b border-[var(--line-2)]">—</td>
                      ) : columns.map(col => {
                        const val = r.props[col];
                        const isNum = val !== "" && val !== null && val !== undefined && isFinite(parseFloat(val)) && !isNaN(parseFloat(val));
                        return (
                          <td
                            key={col}
                            className={`text-[12px] text-slate-800 px-3 py-1.5 border-b border-[var(--line-2)] whitespace-nowrap max-w-[260px] truncate ${
                              isNum ? "font-mono text-right" : ""
                            }`}
                            title={String(val ?? "")}
                          >
                            {val === "" || val === null || val === undefined ? (
                              <span className="text-slate-300">—</span>
                            ) : String(val)}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>

        {/* Footer */}
        <footer className="px-4 py-2.5 border-t border-[var(--line)] flex items-center justify-between gap-3 bg-[var(--panel-2)]">
          <div className="text-[11px] text-slate-500 font-mono">
            {query ? `${rows.length} من ${features.length}` : `${features.length} صف`}
            {selectedIdx !== null && ` · #${selectedIdx + 1} محدد`}
          </div>
          <div className="text-[10.5px] text-slate-400">
            انقر على صف لتركيز الخريطة عليه
          </div>
        </footer>
      </div>
    </div>
  );
};

const Toast = ({ toast }) => {
  if (!toast) return null;
  const tones = {
    info:   { background: "var(--panel)", color: "var(--ink)", border: "1px solid var(--line)" },
    ok:     { background: "#059669",      color: "#ffffff" },
    err:    { background: "#e11d48",      color: "#ffffff" },
    warn:   { background: "#f59e0b",      color: "#ffffff" },
  };
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[1100] toast">
      <div
        className="px-4 py-2.5 rounded-xl shadow-lg text-[13px] font-medium"
        style={tones[toast.tone || 'info']}
      >
        {toast.msg}
      </div>
    </div>
  );
};
